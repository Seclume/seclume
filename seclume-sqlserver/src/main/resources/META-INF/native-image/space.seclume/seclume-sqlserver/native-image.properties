# The code pages of SQL Server's collations - GBK, windows-31j, x-windows-949 and the
# rest of what TdsCollation names. A native image carries only the standard charsets
# unless told otherwise, and single-byte text in those collations would then be read
# as Latin-1 again: no error, the wrong characters. Set here because the driver is
# what needs them, not the application that happens to be built with it.
Args = -H:+AddAllCharsets
