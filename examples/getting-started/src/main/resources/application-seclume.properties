# The database password is in Vault, at secret/app. seclume reads Vault's answer
# into native memory, logs in with it and wipes it: no String, no byte[], nothing
# a heap dump could show.
seclume.datasources.main.url=jdbc:seclume:postgresql://localhost:5432/app?tls=off
seclume.datasources.main.username=app
seclume.datasources.main.secret.provider=vault
seclume.datasources.main.secret.address=https://127.0.0.1:8200
seclume.datasources.main.secret.path=secret/data/app
seclume.datasources.main.secret.token-provider=file
seclume.datasources.main.secret.token-path=secrets/vault-token
# Vault's certificate is checked against the trust store setup.sh made from its
# dev CA (-Djavax.net.ssl.trustStore=...). tls=off for the database only because
# it runs on this machine; in production: ...?tls=verify-full&tlsRootCert=/etc/ssl/db-ca.pem
