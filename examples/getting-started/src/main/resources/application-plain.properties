# For comparison only: the usual way - HikariCP and pgjdbc, the password in the
# environment (SPRING_DATASOURCE_PASSWORD), which Spring turns into a String.
spring.datasource.url=jdbc:postgresql://localhost:5432/app
spring.datasource.username=app
# seclume itself refuses spring.datasource.password - a password in the
# configuration is exactly what it is there to prevent - so for the comparison
# the application runs without it.
spring.autoconfigure.exclude=space.seclume.spring.SeclumeAutoConfiguration
seclume.secret-guard=off
