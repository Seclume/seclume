# Runs out of memory once; the webhook gives it a dump folder and the sidecar
# that redacts what lands there, looking for the mounted credential as well.
apiVersion: v1
kind: Pod
metadata:
  name: oom
  annotations:
    seclume.space/redact-dumps: "true"
    seclume.space/secret-volumes: app
spec:
  restartPolicy: Never
  containers:
    - name: app
      image: docker.io/library/eclipse-temurin:25-jdk
      command: [java, -Xmx64m, -XX:-UsePerfData, /probe/Oom.java]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
      volumeMounts:
        - {name: probe, mountPath: /probe, readOnly: true}
        - {name: app, mountPath: /run/secrets/app, readOnly: true}
  volumes:
    - name: probe
      configMap: {name: oom}
    - name: app
      secret: {secretName: app}
