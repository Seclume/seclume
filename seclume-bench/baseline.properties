# seclume's time over the vendor driver's, per benchmark (below 1: seclume ahead).
# From the run recorded in BENCHMARKS.md (MySQL 8.4 on the same host, 2 forks).
# Replace with `BenchRegression --write` from a nightly run's jmh.json once one
# has been looked at; the ratios travel between machines far better than times.
tolerance=0.15
# batching=rewrite has no baseline: bimodal per fork for both drivers (BENCHMARKS.md).
InsertBenchmark.batch [batching=default, rows=500]=0.6140
InsertBenchmark.oneRow [batching=default, rows=500]=0.8857
# The pool rows are seclume's pool over seclume's driver against HikariCP over the vendor's.
# seclume's pool resets the session on every return and HikariCP does not: on MySQL that is
# one more round trip, and a statement prepared again (BENCHMARKS.md, "How to read the pool
# rows": 272 µs / 139 µs there). These three are from the nightly run 43207183593 of
# 12 November 2026, the first nightly that ran PoolBenchmark on MySQL. The values before it
# (1.0463, 0.9604, 0.9927) did not match what BENCHMARKS.md records for a pool that resets,
# and failed that run.
PoolBenchmark.borrowAndReturn [size=16]=0.8850
PoolBenchmark.borrowPreparedReturn [size=16]=1.8130
PoolBenchmark.borrowQueryReturn [size=16]=1.4910
QueryBenchmark.selectManyRows [rows=1000]=0.8046
QueryBenchmark.selectOne [rows=1000]=1.0173
QueryBenchmark.selectRow [rows=1000]=0.9355
