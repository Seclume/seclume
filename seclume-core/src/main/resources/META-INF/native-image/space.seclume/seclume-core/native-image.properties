# Shared arenas, which this library uses for every receive buffer: a result block
# is filled on one thread and may be read on another, which is what Arena.ofShared
# is for. GraalVM supports it and does not switch it on by default in 25, so an
# image built without this flag builds cleanly and then dies while closing the
# first connection - "Support for Arena.ofShared is not active".
#
# Set here rather than left to whoever builds the image: nobody can be expected to
# deduce a build flag from a stack trace inside the JDK's memory session code.
Args = -H:+UnlockExperimentalVMOptions -H:+SharedArenaSupport
