name: mysql-pool-ab
# Throwaway: PoolBenchmark.borrowQueryReturn on MySQL for the commit before
# #351, #351 itself and main, built side by side and run in turns on one
# runner, so that the runner's speed is the same for all three.
on:
  push:
    branches: [mysql-pool-ab]
permissions:
  contents: read
jobs:
  ab:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: seclume-CI-password-1
          MYSQL_DATABASE: seclume_test
          MYSQL_USER: seclume_test
          MYSQL_PASSWORD: seclume-CI-password-1
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: printf '%s' 'seclume-CI-password-1' > .local-mysql-password
      - name: Build the three
        run: |
          set -e
          for c in deef5533:before fb98856f:pr351 61ca1c5b:main; do
            sha=${c%%:*}; name=${c##*:}
            git worktree add -q ../$name $sha
            (cd ../$name && ./mvnw -B -q -ntp -pl seclume-bench -am -DskipTests package)
            cp ../$name/seclume-bench/target/seclume-bench.jar /tmp/bench-$name.jar
          done
          lscpu | grep -E 'Model name|^CPU\(s\)'
      - name: Measure, in turns
        run: |
          for round in 1 2 3; do
            for name in before pr351 main; do
              echo "##### round $round $name"
              java -Dbench.db=mysql -Dbench.host=127.0.0.1 -Dbench.port=3306 \
                -Dbench.database=seclume_test -Dbench.user=seclume_test \
                -Dbench.password.file=.local-mysql-password \
                -jar /tmp/bench-$name.jar 'bench\.PoolBenchmark\.borrowQueryReturn' \
                -p combination=hikari-vendor,seclume-vendor,seclume-seclume \
                -wi 2 -i 4 -f 1 | grep -E '^PoolBenchmark\.borrowQueryReturn '
            done
          done
      - if: always()
        run: rm -f .local-mysql-password
