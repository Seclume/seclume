name: Release rebuild

# Every release is built again here, from its tag, and each jar compared byte
# for byte with the one on Maven Central. The release itself is built and
# signed on the maintainer's machine; this run is what lets anybody check that
# what Central serves is what the tagged source makes. Only a jar that
# matches gets a SLSA build provenance attestation - which then speaks for
# the file on Central too, since it is the same digest.
#
# Started when the GitHub release is published - after the deploy, so the jars
# are on Central by then, or soon: the download is retried for a while - and
# by hand for any earlier tag.
#
# Built with the JDK the release was built with, to the build: the Temurin
# release named in the tag's .github/release-jdk. Another patch release of the
# JDK writes other javadoc, and "25" would be whichever is newest that day.
# A tag from before that file names its JDK by hand.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: the release tag to rebuild, e.g. v0.15.0
        required: true
      jdk:
        description: the Temurin release it was built with, e.g. jdk-25+36 - empty for the tag's .github/release-jdk
        required: false

permissions:
  contents: read

env:
  # --strict-checksums checks a download against the repository's own checksum;
  # the trusted checksums check it against .mvn/checksums, recorded once - a
  # repository or cache that serves other bytes for a pinned version fails the
  # build. New artifacts are not refused yet (failIfMissing): record them with
  # .github/scripts/record-checksums.sh.
  MAVEN_ARGS: >-
    --strict-checksums
    -Daether.artifactResolver.postProcessor.trustedChecksums=true
    -Daether.artifactResolver.postProcessor.trustedChecksums.checksumAlgorithms=SHA-256
    -Daether.trustedChecksumsSource.summaryFile=true
    -Daether.trustedChecksumsSource.summaryFile.basedir=${{ github.workspace }}/.mvn/checksums

jobs:
  rebuild:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check the tag's form
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "not a release tag: $TAG"; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      # The comparing script from this workflow's own commit: a tag from
      # before it has none. Outside the build, under _tools.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: _tools
          sparse-checkout: .github/scripts/jar_entries_diff.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # No setup-java and no cache: the exact JDK, checked against the checksum
      # Adoptium publishes, and nothing another run could have left behind.
      - name: The JDK the release was built with
        env:
          JDK_INPUT: ${{ inputs.jdk }}
        run: |
          set -euo pipefail
          release="${JDK_INPUT:-}"
          if [ -z "$release" ] && [ -f .github/release-jdk ]; then
            release="$(tr -d '[:space:]' < .github/release-jdk)"
          fi
          case "$release" in
            jdk-[0-9]*) ;;
            *) echo "no Temurin release named for $TAG: give it as the jdk input"; exit 1 ;;
          esac
          api="https://api.adoptium.net/v3/assets/release_name/eclipse/${release//+/%2B}"
          api="$api?architecture=x64&heap_size=normal&image_type=jdk&os=linux&project=jdk"
          curl -fsS "$api" -o "$RUNNER_TEMP/jdk.json"
          link="$(jq -r '.binaries[0].package.link' "$RUNNER_TEMP/jdk.json")"
          sum="$(jq -r '.binaries[0].package.checksum' "$RUNNER_TEMP/jdk.json")"
          curl -fsSL "$link" -o "$RUNNER_TEMP/jdk.tar.gz"
          echo "$sum  $RUNNER_TEMP/jdk.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/jdk"
          tar -xzf "$RUNNER_TEMP/jdk.tar.gz" -C "$RUNNER_TEMP/jdk" --strip-components=1
          echo "JAVA_HOME=$RUNNER_TEMP/jdk" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/jdk/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/jdk/bin/java" -version
          echo "JDK: $release" >> "$GITHUB_STEP_SUMMARY"
      - name: Build the tag as the release is built
        # -Prelease adds sources and javadoc; the signature is the
        # maintainer's and is not made here.
        run: ./mvnw -B -Prelease -DskipTests -Dgpg.skip=true package
      - name: Compare every jar with Maven Central
        id: compare
        run: |
          set -euo pipefail
          version="${TAG#v}"
          base="https://repo1.maven.org/maven2/space/seclume"
          compared=0; differ=0
          : > matched.txt
          {
            echo "## $TAG rebuilt and compared with Maven Central"
            echo
            echo "| Artifact | Result |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for jar in */target/*-"$version".jar */target/*-"$version"-sources.jar */target/*-"$version"-javadoc.jar; do
            [ -f "$jar" ] || continue
            module="${jar%%/*}"
            name="$(basename "$jar")"
            url="$base/$module/$version/$name"
            got=""
            for attempt in 1 2 3 4 5 6; do
              status=$(curl -sS -o central.jar -w '%{http_code}' "$url" || echo 000)
              if [ "$status" = 200 ]; then got=yes; break; fi
              if [ "$status" = 404 ] && [ "$attempt" -ge 2 ]; then break; fi
              sleep 60
            done
            if [ -z "$got" ]; then
              echo "| \`$name\` | not on Central (not published, or not yet) |" >> "$GITHUB_STEP_SUMMARY"
              echo "$name: not on Central"
              continue
            fi
            compared=$((compared + 1))
            ours=$(sha256sum "$jar" | cut -d' ' -f1)
            theirs=$(sha256sum central.jar | cut -d' ' -f1)
            if [ "$ours" = "$theirs" ]; then
              echo "| \`$name\` | same: \`$ours\` |" >> "$GITHUB_STEP_SUMMARY"
              echo "$name: same"
              echo "$jar" >> matched.txt
            else
              differ=$((differ + 1))
              echo "| \`$name\` | **differs**: built \`$ours\`, Central \`$theirs\` |" >> "$GITHUB_STEP_SUMMARY"
              echo "$name: differs"
              python3 -I _tools/.github/scripts/jar_entries_diff.py "$jar" central.jar || true
            fi
          done
          rm -f central.jar
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "$compared compared, $differ differ." >> "$GITHUB_STEP_SUMMARY"
          if [ "$compared" -eq 0 ]; then
            echo "nothing of $TAG was found on Central"; exit 1
          fi
          if [ "$differ" -gt 0 ]; then
            echo "$differ jar(s) of $TAG differ from what Central serves"; exit 1
          fi
          # The subjects of the attestation: the jars that matched, and no other.
          {
            echo "subjects<<END_OF_SUBJECTS"
            cat matched.txt
            echo "END_OF_SUBJECTS"
          } >> "$GITHUB_OUTPUT"
      - name: Attest the build provenance of the matching jars
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.compare.outputs.subjects }}
