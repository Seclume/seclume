name: flake-hunt

permissions:
  contents: read

# The whole CI, three times at once on one commit - by hand, or on Sunday
# night. A test that passes on a pull request and fails on main is a test that
# depends on timing, ordering or a server's mood; one run in a hundred is
# enough to cost an hour of CI and a re-run nobody explains. Here every run is
# kept: a job that fails in one of three is the list to work through, and
# summarize_flakes.py writes it as one annotation per job.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 19 * * 6'

jobs:
  ci:
    name: run ${{ matrix.run }}
    strategy:
      fail-fast: false
      matrix:
        run: ['1', '2', '3']
    uses: ./.github/workflows/ci.yml
    with:
      run: ${{ matrix.run }}
    # No secrets: every one ci.yml reads is a throwaway container password
    # with a literal fallback, and the hunt runs on those.

  summary:
    needs: ci
    if: always()
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Jobs that failed in some runs and passed in others
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/summarize_flakes.py "${{ github.repository }}" "${{ github.run_id }}"
