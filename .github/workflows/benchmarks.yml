# Benchmarks, nightly, kept as an artefact.
#
# The README's figures are the loudest thing in the project, which is exactly
# why they have to be boring to reproduce. This runs the rig against a real
# server and keeps two things: the JMH JSON, and the record BenchRecord writes
# from it - the machine, the JDK, what the server said it was, how far away it
# was, and every iteration rather than a mean.
#
# Deliberately NOT part of the push build. A benchmark on a shared runner is
# noisy, and a noisy gate teaches people to re-run it until it passes, which is
# worse than having no gate at all.
name: benchmarks

on:
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: seclume-CI-password-1
          MYSQL_DATABASE: seclume_test
          MYSQL_USER: seclume_test
          MYSQL_PASSWORD: seclume-CI-password-1
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}
      - run: printf '%s' 'seclume-CI-password-1' > .local-mysql-password
      - run: ./mvnw -B -DskipTests package
      - name: Measure
        run: >
          java -Dbench.db=mysql -Dbench.host=127.0.0.1 -Dbench.port=3306
          -Dbench.database=seclume_test -Dbench.user=seclume_test
          -Dbench.password.file=.local-mysql-password
          -jar seclume-bench/target/seclume-bench.jar
          QueryBenchmark InsertBenchmark
          -rf json -rff seclume-bench/target/jmh.json -wi 3 -i 5 -f 1
      - name: Record what it was
        run: >
          java
          -Dbench.url="jdbc:seclume:mysql://127.0.0.1:3306/seclume_test?user=seclume_test&provider=file&path=.local-mysql-password"
          -cp seclume-bench/target/seclume-bench.jar
          space.seclume.bench.BenchRecord
          seclume-bench/target/BENCHMARKS.md seclume-bench/target/jmh.json
          "see the Measure step of this workflow"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmarks
          path: |
            seclume-bench/target/jmh.json
            seclume-bench/target/BENCHMARKS.md
          retention-days: 90
      - if: always()
        run: rm -f .local-mysql-password
      # Regressions: seclume's time over the vendor driver's, from this run,
      # against seclume-bench/baseline.properties. A ratio, because both halves
      # ran on this runner minutes apart - the runner's own speed cancels out,
      # which an absolute time from last night's runner would not. Fails the
      # job on a ratio 15 % worse than the baseline or on a lost lead.
      - name: Compare with the baseline
        run: >
          java -cp seclume-bench/target/seclume-bench.jar
          space.seclume.bench.BenchRegression
          seclume-bench/baseline.properties seclume-bench/target/jmh.json
