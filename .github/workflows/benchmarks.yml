# Benchmarks, nightly, kept as an artefact.
#
# The README's figures are the loudest thing in the project, which is exactly
# why they have to be boring to reproduce. This runs the rig against a real
# server and keeps two things: the JMH JSON, and the record BenchRecord writes
# from it - the machine, the JDK, what the server said it was, how far away it
# was, and every iteration rather than a mean.
#
# Deliberately NOT part of the push build. A benchmark on a shared runner is
# noisy, and a noisy gate teaches people to re-run it until it passes, which is
# worse than having no gate at all.
name: benchmarks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r2dbc:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: seclume_test
          POSTGRES_DB: seclume_test
          POSTGRES_PASSWORD: seclume-CI-password-1
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -h 127.0.0.1 -U seclume_test"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: printf '%s' 'seclume-CI-password-1' > .local-pg-password
      - run: .github/scripts/mvnw-retry.sh -B -pl seclume-bench -am -DskipTests package
      - name: Profile one statement and one row
        run: |
          java -Dbench.db=postgresql -Dbench.host=127.0.0.1 -Dbench.port=5432 \
            -Dbench.database=seclume_test -Dbench.user=seclume_test \
            -Dbench.password.file=.local-pg-password -Dbench.tls=off \
            -jar seclume-bench/target/seclume-bench.jar 'R2dbcBenchmark.selectRow' \
            -wi 3 -i 5 -f 1 -prof 'jfr:dir=/tmp/jfr'
          find /tmp/jfr -name '*.jfr' | sort | while read -r file; do
            jfr print --json --events jdk.ExecutionSample --stack-depth 40 "$file" > /tmp/samples.json
            python3 .github/scripts/jfr_top.py /tmp/samples.json "$file"
          done
      - if: always()
        run: rm -f .local-pg-password

