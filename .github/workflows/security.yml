# Static analysis and known vulnerabilities, on every push and weekly.
#
# Semgrep: the Java, security-audit, secrets and GitHub Actions rule sets. It
# fails on any finding. The findings accepted on purpose are marked in the
# source with a nosemgrep comment and the reason on the line above (the
# trust-everything manager behind trustServerCertificate, the loopback test
# servers, plain HTTP to a Patroni URL someone configured as http).
#
# Trivy: an SBOM of the whole build, test and benchmark dependencies included
# (the drivers themselves have none beyond the JDK), checked against the
# vulnerability databases. It fails on HIGH and CRITICAL.
#
# CodeQL runs in its own workflow; Dependabot keeps the versions current.
name: security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '10 5 * * 1'

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    container:
      image: semgrep/semgrep:1.177.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: >
          semgrep scan --config p/java --config p/security-audit --config p/secrets
          --config p/github-actions --metrics=off --error --json-output=semgrep.json
      # Each finding as an annotation - rule, file and line - so that a red run
      # says what it found without anyone opening the log.
      - if: failure()
        run: |
          python3 - <<'PY'
          import json
          try:
              results = json.load(open('semgrep.json')).get('results', [])
          except (OSError, ValueError):
              results = []
          for r in results[:50]:
              message = (r.get('check_id', '') + ': ' + r.get('extra', {}).get('message', ''))
              message = message.replace('%', '%25').replace('\r', ' ').replace('\n', ' ')[:600]
              print(f"::error file={r.get('path')},line={r.get('start', {}).get('line', 1)}::{message}")
          print('semgrep findings:', len(results))
          PY

  dependencies:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: SBOM of everything the build uses
        run: |
          set -o pipefail
          .github/scripts/mvnw-retry.sh -B -DskipTests install 2>&1 | tee build.log
          .github/scripts/mvnw-retry.sh -B org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom \
            -DincludeTestScope=true -DoutputFormat=json
      # A build that fails here says why on the check: the compiler's warnings
      # (-Werror makes them errors without a location) and Maven's errors.
      - if: failure()
        run: |
          [ -f build.log ] || exit 0
          # What the compiler said before it stopped, and Maven's errors - not
          # the shade plugin's overlapping-resource warnings.
          text=$( (grep -B12 "COMPILATION ERROR" build.log | grep -v "overlapping\|^\[WARNING\]   - "; grep -E "^\[ERROR\]" build.log) \
            | grep -v "Re-run Maven\|full stack trace\|\[Help \|^\[ERROR\] *$\|To see the full\|For more information" \
            | head -30 | sed 's/%/%25/g' | tr '\n' ' ' | cut -c1-3800)
          echo "::error title=build::$text"
      # Each finding also becomes an annotation on the check - package, version,
      # advisory and the version that fixes it - so a red run says what to bump
      # without anyone having to open the log.
      - name: Known vulnerabilities
        run: |
          status=0
          docker run --rm -v "$PWD/target:/w" aquasec/trivy:0.74.0 \
            sbom --scanners vuln --severity HIGH,CRITICAL --exit-code 1 \
            --format json --output /w/trivy.json /w/bom.json || status=$?
          if [ -f target/trivy.json ]; then
            jq -r '.Results[]?.Vulnerabilities[]? |
              "::error title=\(.VulnerabilityID) (\(.Severity))::\(.PkgName) \(.InstalledVersion) - fixed in \(.FixedVersion // "no release yet") - \(.Title // "" | .[0:120])"' \
              target/trivy.json | sort -u
          fi
          exit "$status"
