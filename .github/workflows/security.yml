# Static analysis and known vulnerabilities, on every push and weekly.
#
# Semgrep: the Java, security-audit, secrets and GitHub Actions rule sets. It
# fails on any finding. The findings accepted on purpose are marked in the
# source with a nosemgrep comment and the reason on the line above (the
# trust-everything manager behind trustServerCertificate, the loopback test
# servers, plain HTTP to a Patroni URL someone configured as http).
#
# Trivy: an SBOM of the whole build, test and benchmark dependencies included
# (the drivers themselves have none beyond the JDK), checked against the
# vulnerability databases. It fails on HIGH and CRITICAL.
#
# CodeQL runs in its own workflow; Dependabot keeps the versions current.
name: security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '10 5 * * 1'

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: semgrep/semgrep:1.177.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: >
          semgrep scan --config p/java --config p/security-audit --config p/secrets
          --config p/github-actions --metrics=off --error

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: SBOM of everything the build uses
        run: >
          ./mvnw -B -DskipTests install &&
          ./mvnw -B org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
          -DincludeTestScope=true -DoutputFormat=json
      - name: Known vulnerabilities
        run: >
          docker run --rm -v "$PWD/target:/w" aquasec/trivy:0.74.0
          sbom --scanners vuln --severity HIGH,CRITICAL --exit-code 1 /w/bom.json
