name: CI

# What this file is actually worth: here the tests run against *real*
# databases. A development machine rarely has more than one, and a test server
# somebody built themselves only confirms their own assumptions. This is where
# "it compiles and looks plausible" turns into evidence.
#
# Every job writes the password into a file and points the driver at that
# file - the same path the library offers an application. No echo, and no
# environment variable in the log.

on:
  push:
  pull_request:

jobs:
  # Everything provable without a database: the cryptography against the
  # published vectors, the heap-dump proof with its negative control, the pool
  # mechanics, and the rule that no forbidden API call slips in.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - run: ./mvnw -B -pl seclume-core,seclume-tck,seclume-pool -am test

  postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Two releases, so that a protocol difference shows up here and not at
        # somebody's installation.
        image: postgres:${{ matrix.version }}
        env:
          POSTGRES_USER: seclume_test
          POSTGRES_PASSWORD: ${{ secrets.PG_TEST_PASSWORD || 'seclume-ci-password' }}
          POSTGRES_DB: seclume_test
          # scram-sha-256 is the path the driver has to manage.
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        version: ['15', '18']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - run: printf '%s' "${{ secrets.PG_TEST_PASSWORD || 'seclume-ci-password' }}" > .local-pg-password
      - run: ./mvnw -B -pl seclume-postgresql,seclume-pool,seclume-spring-boot-starter -am test
      - if: always()
        run: rm -f .local-pg-password

  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MY_TEST_PASSWORD || 'seclume-ci-password' }}
          MYSQL_DATABASE: seclume_test
          MYSQL_USER: seclume_test
          MYSQL_PASSWORD: ${{ secrets.MY_TEST_PASSWORD || 'seclume-ci-password' }}
        ports: ['3306:3306']
        options: >-
          --health-cmd "${{ matrix.health }}"
          --health-interval 5s --health-timeout 5s --health-retries 20
    strategy:
      fail-fast: false
      matrix:
        # MySQL 8 uses caching_sha2_password, MariaDB mysql_native_password -
        # both paths have to work. They do not agree on what a health check is
        # called either: mysqladmin is gone from the MariaDB images.
        include:
          - image: 'mysql:8.4'
            health: 'mysqladmin ping -h 127.0.0.1'
          - image: 'mariadb:11.4'
            health: 'healthcheck.sh --connect --innodb_initialized'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - run: printf '%s' "${{ secrets.MY_TEST_PASSWORD || 'seclume-ci-password' }}" > .local-mysql-password
      - run: ./mvnw -B -pl seclume-mysql -am test
      - if: always()
        run: rm -f .local-mysql-password

  sqlserver:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: ${{ secrets.MSSQL_TEST_PASSWORD || 'seclume-CI-password-1' }}
        ports: ['1433:1433']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      # The image carries no health check, so wait for the port rather than
      # guessing a sleep long enough.
      - name: Wait for SQL Server
        run: |
          for i in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/1433) >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          echo "SQL Server did not open port 1433" >&2
          exit 1
      # The image brings no database of its own, and the XA tests need one:
      # a distributed transaction is enlisted per database, so master will
      # not do.
      - name: Create the test database
        run: |
          id=$(docker ps -q --filter "ancestor=mcr.microsoft.com/mssql/server:2022-latest" | head -1)
          sql="if db_id('seclume_test') is null create database seclume_test"
          docker exec "$id" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q "$sql" -P "${{ secrets.MSSQL_TEST_PASSWORD || 'seclume-CI-password-1' }}"
      - run: printf '%s' "${{ secrets.MSSQL_TEST_PASSWORD || 'seclume-CI-password-1' }}" > .local-mssql-password
      - run: ./mvnw -B -pl seclume-sqlserver -am test
      - if: always()
        run: rm -f .local-mssql-password

  # Oracle Free covers the 12c login path, which is the one newer instances
  # use. The image takes longer to come up than the others.
  oracle:
    runs-on: ubuntu-latest
    services:
      oracle:
        image: gvenzl/oracle-free:23-slim
        env:
          ORACLE_PASSWORD: ${{ secrets.ORA_TEST_PASSWORD || 'seclume-ci-password' }}
          APP_USER: seclume_test
          APP_USER_PASSWORD: ${{ secrets.ORA_TEST_PASSWORD || 'seclume-ci-password' }}
        ports: ['1521:1521']
        options: >-
          --health-cmd healthcheck.sh --health-interval 20s
          --health-timeout 10s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - run: printf '%s' "${{ secrets.ORA_TEST_PASSWORD || 'seclume-ci-password' }}" > .local-oracle-password
      - run: ./mvnw -B -pl seclume-oracle -am test
      - if: always()
        run: rm -f .local-oracle-password

  # The PostgreSQL family: CockroachDB and YugabyteDB speak the same wire
  # protocol. What is checked here is not a new driver but the claim that the
  # existing one serves them - a test run instead of a driver.
  #
  # Both are reachable without a password, so the tests that need one skip
  # themselves. That is honest rather than useful, and it is the reason this
  # job is not evidence yet: see docs/roadmap.md.
  postgres-compatible:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cockroachdb
            image: cockroachdb/cockroach:latest-v24.1
            command: start-single-node --insecure
            port: 26257
          - name: yugabytedb
            image: yugabytedb/yugabyte:latest
            command: bin/yugabyted start --daemon=false
            port: 5433
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Start ${{ matrix.name }}
        run: |
          docker run -d --name ${{ matrix.name }} \
            -p ${{ matrix.port }}:${{ matrix.port }} \
            ${{ matrix.image }} ${{ matrix.command }}
          sleep 45
      # Where the server is comes in the way TestHosts reads it - a system
      # property, not an environment variable of its own invention.
      - run: ./mvnw -B -pl seclume-postgresql -am test -Dseclume.pg.port=${{ matrix.port }}
      - if: always()
        run: docker rm -f ${{ matrix.name }}
