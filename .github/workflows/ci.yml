name: CI

permissions:
  contents: read

# What this file is actually worth: here the tests run against *real*
# databases. A development machine rarely has more than one, and a test server
# somebody built themselves only confirms their own assumptions. This is where
# "it compiles and looks plausible" turns into evidence.
#
# Every job writes the password into a file and points the driver at that
# file - the same path the library offers an application. No echo, and no
# environment variable in the log.
#
# The literals below are not secrets and are not meant to look like any. Each
# is the throwaway password of a container that is created for one job and
# destroyed with it, reachable only from that job. A repository secret
# overrides it where one is configured; the literal is the fallback so that a
# fork can run the same suite without being given anything.

on:
  # Pushes to main, and pull requests. A push to a pull request's branch is
  # already covered by the pull_request run; running both doubled every
  # Dependabot update into two full matrices. Documentation alone changes no
  # test result.
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'test-reports/**', 'LICENSE', 'NOTICE']
  pull_request:
    # Required checks must also exist for documentation-only pull requests.

# The free plan runs 20 jobs at a time across the whole account. A newer push
# to the same pull request replaces the older run instead of queueing behind
# it. On main every commit keeps its own run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The crypto policy action as a user's pipeline runs it: the first release
  # meets a strict policy, the second - the hybrid lost, an RSA-2048 key, a
  # data key from a file - fails it and is a step back from the first.
  crypto-policy-action:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - run: ./mvnw -B -pl seclume-verify -am package -DskipTests
      - name: The policy and the jar
        shell: bash
        run: |
          set -euo pipefail
          jar=$(find seclume-verify/target -maxdepth 1 -name 'seclume-verify-*.jar' -not -name '*-sources.jar' -not -name '*-javadoc.jar' | head -1)
          test -n "$jar"
          echo "VERIFY_JAR=$jar" >> "$GITHUB_ENV"
          printf 'rsa.min-bits=3072\ntls.require-hybrid=true\ndata-key.require-kms=true\n' > "$RUNNER_TEMP/policy.properties"
      - name: The first release meets the policy
        uses: ./.github/actions/crypto-policy
        with:
          jar: ${{ env.VERIFY_JAR }}
          cbom: seclume-verify/src/test/resources/cbom/release-1.json
          policy: ${{ runner.temp }}/policy.properties
      - name: The second fails it and steps back
        id: negative
        continue-on-error: true
        uses: ./.github/actions/crypto-policy
        with:
          jar: ${{ env.VERIFY_JAR }}
          cbom: seclume-verify/src/test/resources/cbom/release-2.json
          policy: ${{ runner.temp }}/policy.properties
          baseline: seclume-verify/src/test/resources/cbom/release-1.json
      - name: Require the negative control
        env:
          NEGATIVE_OUTCOME: ${{ steps.negative.outcome }}
          NEGATIVE_STATUS: ${{ steps.negative.outputs.status }}
        run: test "$NEGATIVE_OUTCOME" = failure && test "$NEGATIVE_STATUS" = 1
      - name: A step back alone, with the default policy, fails as well
        id: diff-only
        continue-on-error: true
        uses: ./.github/actions/crypto-policy
        with:
          jar: ${{ env.VERIFY_JAR }}
          cbom: seclume-verify/src/test/resources/cbom/release-2.json
          baseline: seclume-verify/src/test/resources/cbom/release-1.json
      - name: Require the step back to fail
        env:
          OUTCOME: ${{ steps.diff-only.outcome }}
        run: test "$OUTCOME" = failure

  heapcheck-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - run: ./mvnw -B -pl seclume-heapcheck -am package -DskipTests
      - name: Create clean and leaking test dumps
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/heapcheck-fixtures/secrets"
          openssl rand -hex 32 > "$RUNNER_TEMP/heapcheck-fixtures/secrets/credential"
          for mode in clean leak token; do
            java seclume-heapcheck/ci/Probe.java "$mode" "$RUNNER_TEMP/heapcheck-fixtures/secrets/credential" > "$RUNNER_TEMP/heapcheck-fixtures/$mode.log" &
            pid=$!
            trap 'kill "$pid" 2>/dev/null || true' EXIT
            for attempt in $(seq 1 30); do
              if grep -q ready "$RUNNER_TEMP/heapcheck-fixtures/$mode.log"; then break; fi
              sleep 1
            done
            grep -q ready "$RUNNER_TEMP/heapcheck-fixtures/$mode.log"
            jcmd "$pid" GC.heap_dump -all "$RUNNER_TEMP/heapcheck-fixtures/$mode.hprof"
            kill "$pid"
            wait "$pid" || true
            trap - EXIT
          done
          jar=$(find seclume-heapcheck/target -maxdepth 1 -name 'seclume-heapcheck-*.jar' | head -1)
          test -n "$jar"
          echo "HEAPCHECK_JAR=$jar" >> "$GITHUB_ENV"
      - name: Clean heap must pass
        uses: ./.github/actions/heapcheck
        with:
          jar: ${{ env.HEAPCHECK_JAR }}
          dump: ${{ runner.temp }}/heapcheck-fixtures/clean.hprof
          secret-directory: ${{ runner.temp }}/heapcheck-fixtures/secrets
          artifact-name: heapcheck-clean
      - name: Leaking heap must fail
        id: negative
        continue-on-error: true
        uses: ./.github/actions/heapcheck
        with:
          jar: ${{ env.HEAPCHECK_JAR }}
          dump: ${{ runner.temp }}/heapcheck-fixtures/leak.hprof
          secret-directory: ${{ runner.temp }}/heapcheck-fixtures/secrets
          artifact-name: heapcheck-negative-control
      - name: Require the negative control
        env:
          NEGATIVE_OUTCOME: ${{ steps.negative.outcome }}
          NEGATIVE_STATUS: ${{ steps.negative.outputs.status }}
        run: test "$NEGATIVE_OUTCOME" = failure && test "$NEGATIVE_STATUS" = 1
      # Discovery: nothing named, the token found by its shape - and the clean
      # heap still clean with discovery on, so a false alarm fails this job.
      - name: Clean heap must pass discovery
        uses: ./.github/actions/heapcheck
        with:
          jar: ${{ env.HEAPCHECK_JAR }}
          dump: ${{ runner.temp }}/heapcheck-fixtures/clean.hprof
          discover: 'true'
          artifact-name: heapcheck-discover-clean
      - name: Unnamed token must be discovered
        id: discovered
        continue-on-error: true
        uses: ./.github/actions/heapcheck
        with:
          jar: ${{ env.HEAPCHECK_JAR }}
          dump: ${{ runner.temp }}/heapcheck-fixtures/token.hprof
          discover: 'true'
          artifact-name: heapcheck-discover-negative-control
      - name: Require the discovery control
        env:
          DISCOVERED_OUTCOME: ${{ steps.discovered.outcome }}
          DISCOVERED_STATUS: ${{ steps.discovered.outputs.status }}
        run: test "$DISCOVERED_OUTCOME" = failure && test "$DISCOVERED_STATUS" = 1
      - name: An ignored detector is left out
        uses: ./.github/actions/heapcheck
        with:
          jar: ${{ env.HEAPCHECK_JAR }}
          dump: ${{ runner.temp }}/heapcheck-fixtures/token.hprof
          discover: 'true'
          ignore: vault-token
          artifact-name: heapcheck-discover-ignored
      # Redaction of both leaking dumps: the copies must pass the same checks
      # their originals failed above.
      - name: Redact the leaking dumps
        shell: bash
        run: |
          set -euo pipefail
          fixtures="$RUNNER_TEMP/heapcheck-fixtures"
          for mode in leak token; do
            java --enable-native-access=ALL-UNNAMED -jar "$HEAPCHECK_JAR" \
              --dump "$fixtures/$mode.hprof" --secret-dir "$fixtures/secrets" --discover \
              --no-attribution --redact "$fixtures/$mode-redacted.hprof"
            test "$(stat -c %a "$fixtures/$mode-redacted.hprof")" = 600
            test "$(stat -c %s "$fixtures/$mode-redacted.hprof")" = "$(stat -c %s "$fixtures/$mode.hprof")"
          done
      - name: The redacted leak must pass
        uses: ./.github/actions/heapcheck
        with:
          jar: ${{ env.HEAPCHECK_JAR }}
          dump: ${{ runner.temp }}/heapcheck-fixtures/leak-redacted.hprof
          secret-directory: ${{ runner.temp }}/heapcheck-fixtures/secrets
          discover: 'true'
          artifact-name: heapcheck-redacted-leak
      - name: The redacted token must pass discovery
        uses: ./.github/actions/heapcheck
        with:
          jar: ${{ env.HEAPCHECK_JAR }}
          dump: ${{ runner.temp }}/heapcheck-fixtures/token-redacted.hprof
          discover: 'true'
          artifact-name: heapcheck-redacted-token
      - name: Remove test dumps and credential
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/heapcheck-fixtures"
  # kubectl seclume heapcheck and redact against a real cluster: kind, three
  # pods whose JVMs run as an unprivileged user with the credential mounted as
  # a secret. The work runs in an ephemeral container beside each JVM, and only
  # the report or the redacted copy comes out - the dump must be gone from the
  # pod afterwards.
  kubectl-heapcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - run: ./mvnw -B -pl seclume-heapcheck -am package -DskipTests
      - name: A cluster with a leaking, a clean and a token-holding application
        run: |
          set -euo pipefail
          command -v kind >/dev/null || go install sigs.k8s.io/kind@v0.27.0
          export PATH="$PATH:$(go env GOPATH)/bin"
          kind create cluster --name seclume --wait 180s
          for image in docker.io/library/eclipse-temurin:25-jdk; do
            docker pull -q "$image" && kind load docker-image "$image" --name seclume
          done
          kubectl create secret generic app --from-literal=credential="$(openssl rand -hex 32)"
          kubectl create configmap probe --from-file=seclume-heapcheck/ci/Probe.java
          kubectl apply -f seclume-heapcheck/kubectl/ci/pods.yaml
          kubectl wait --for=condition=Ready pod/leak pod/clean pod/token --timeout=180s
          for pod in leak clean token; do
            for _ in $(seq 1 60); do
              kubectl logs "$pod" | grep -q ready && break
              sleep 1
            done
            kubectl logs "$pod" | grep -q ready
          done
          jar=$(find seclume-heapcheck/target -maxdepth 1 -name 'seclume-heapcheck-*.jar' | head -1)
          echo "SECLUME_HEAPCHECK_JAR=$PWD/$jar" >> "$GITHUB_ENV"
          echo "SECLUME_HEAPCHECK_IMAGE=docker.io/library/eclipse-temurin:25-jdk" >> "$GITHUB_ENV"
      - name: The leak is found inside the pod, and only the report comes out
        run: |
          set -euo pipefail
          plugin=seclume-heapcheck/kubectl/kubectl-seclume
          expect() { # expect <exit code> <report> -- <plugin arguments>
            local want=$1 out=$2 code=0; shift 3
            "$plugin" heapcheck "$@" > "$out" || code=$?
            test "$code" = "$want" || { echo "$* exited $code, not $want"; cat "$out"; exit 1; }
          }
          expect 1 leak.json -- leak --secret-dir /run/secrets/app --format json
          grep -q '"verdict": "FOUND"' leak.json
          grep -q '"source": "/run/secrets/app/credential"' leak.json
          expect 0 clean.sarif -- clean --secret-dir /run/secrets/app --format sarif
          grep -q '"version": "2.1.0"' clean.sarif
          expect 1 token.md -- token --discover --format md
          grep -q 'vault-token' token.md
          # redact: the dump redacted inside the pod, only the copy out - which
          # a check here, with the credential itself, must find clean.
          credential_file="$RUNNER_TEMP/credential"
          (umask 077 && kubectl get secret app -o jsonpath='{.data.credential}' | base64 -d \
            > "$credential_file")
          "$plugin" redact leak -o leak-redacted.hprof --secret-dir /run/secrets/app --discover
          test "$(stat -c %a leak-redacted.hprof)" = 600
          java --enable-native-access=ALL-UNNAMED -jar "$SECLUME_HEAPCHECK_JAR" \
            --dump leak-redacted.hprof --secret-file "$credential_file" --discover --no-attribution
          "$plugin" redact token -o token-redacted.hprof --discover
          java --enable-native-access=ALL-UNNAMED -jar "$SECLUME_HEAPCHECK_JAR" \
            --dump token-redacted.hprof --discover --no-attribution
          code=0
          "$plugin" redact leak -o leak-redacted.hprof --discover 2>/dev/null || code=$?
          test "$code" = 2 || { echo "an existing copy was overwritten"; exit 1; }
          rm -f "$credential_file" leak-redacted.hprof token-redacted.hprof
          for pod in leak clean token; do
            left=$(kubectl exec "$pod" -c app -- sh -c 'ls /tmp | grep -c "[.]hprof$" || true')
            test "$left" = 0 || { echo "a heap dump was left in $pod"; exit 1; }
          done
          credential=$(kubectl get secret app -o jsonpath='{.data.credential}' | base64 -d)
          if grep -qF "$credential" leak.json clean.sarif token.md; then
            echo "a report holds the credential"; exit 1
          fi
      - name: Remove the cluster
        if: always()
        run: kind delete cluster --name seclume || true

  # The admission webhook in a real cluster: kind, the webhook installed with
  # a CA of its own, and an application that runs out of memory in a namespace
  # that opted in. The dump it writes must be redacted where it lies by the
  # injected sidecar - no plain dump left, the copy clean of the credential.
  admission-webhook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - run: ./mvnw -B -pl seclume-admission,seclume-heapcheck -am package -DskipTests
      - name: A cluster with the webhook
        run: |
          set -euo pipefail
          command -v kind >/dev/null || go install sigs.k8s.io/kind@v0.27.0
          export PATH="$PATH:$(go env GOPATH)/bin"
          kind create cluster --name seclume --wait 180s
          for image in docker.io/library/eclipse-temurin:25-jdk docker.io/library/eclipse-temurin:25-jre; do
            docker pull -q "$image" && kind load docker-image "$image" --name seclume
          done
          bash seclume-admission/deploy/build-image.sh seclume-admission:ci
          kind load docker-image seclume-admission:ci --name seclume
          SECLUME_IMAGE=seclume-admission:ci bash seclume-admission/deploy/install.sh
          kubectl -n seclume-system rollout status deploy/seclume-admission --timeout=180s
          jar=$(find seclume-heapcheck/target -maxdepth 1 -name 'seclume-heapcheck-*.jar' | head -1)
          echo "SECLUME_HEAPCHECK_JAR=$PWD/$jar" >> "$GITHUB_ENV"
      - name: A dump written on OutOfMemoryError is redacted where it lies
        run: |
          set -euo pipefail
          kubectl create namespace shop
          kubectl label namespace shop seclume.space/inject=enabled
          kubectl -n shop create secret generic app --from-literal=credential="$(openssl rand -hex 32)"
          kubectl -n shop create configmap oom --from-file=seclume-admission/ci/Oom.java
          kubectl -n shop apply -f seclume-admission/ci/oom-pod.yaml
          kubectl -n shop get pod oom -o json > oom.json
          python3 - <<'PY'
          import json
          pod = json.load(open('oom.json'))
          names = [c['name'] for c in pod['spec']['containers']]
          assert names == ['app', 'seclume-redact-dumps'], names
          env = {e['name']: e.get('value') for e in pod['spec']['containers'][0]['env']}
          assert '-XX:HeapDumpPath=/seclume/dumps' in env['JAVA_TOOL_OPTIONS'], env
          sidecar = pod['spec']['containers'][1]
          assert sidecar['securityContext']['runAsUser'] == 1000, sidecar
          assert '/seclume/secrets/app' in sidecar['command'], sidecar['command']
          assert pod['metadata']['annotations']['seclume.space/injected'] == 'redact-dumps'
          print('injected as expected')
          PY
          redacted=""
          for _ in $(seq 1 150); do
            redacted=$(kubectl -n shop exec oom -c seclume-redact-dumps -- ls /seclume/dumps \
              2>/dev/null | grep '[.]redacted[.]hprof$' || true)
            test -n "$redacted" && break
            sleep 2
          done
          kubectl -n shop logs oom -c app | tail -5 || true
          kubectl -n shop logs oom -c seclume-redact-dumps || true
          test -n "$redacted" || { echo "no redacted dump appeared"; exit 1; }
          left=$(kubectl -n shop exec oom -c seclume-redact-dumps -- ls -a /seclume/dumps)
          echo "$left"
          if echo "$left" | grep -v '[.]redacted[.]hprof$' | grep -q '[.]hprof'; then
            echo "a plain heap dump was left beside the redacted one"; exit 1
          fi
          kubectl -n shop exec oom -c seclume-redact-dumps -- cat "/seclume/dumps/$redacted" \
            > redacted.hprof
          credential_file="$RUNNER_TEMP/credential"
          (umask 077 && kubectl -n shop get secret app -o jsonpath='{.data.credential}' \
            | base64 -d > "$credential_file")
          java --enable-native-access=ALL-UNNAMED -jar "$SECLUME_HEAPCHECK_JAR" \
            --dump redacted.hprof --secret-file "$credential_file" --discover --no-attribution
          rm -f "$credential_file" redacted.hprof oom.json
      - name: The SPIFFE socket, and namespaces that did not opt in
        run: |
          set -euo pipefail
          kubectl -n shop create --dry-run=server -o json \
            -f seclume-admission/ci/spiffe-pod.yaml > spiffe.json
          kubectl create namespace other
          kubectl -n other create --dry-run=server -o json \
            -f seclume-admission/ci/spiffe-pod.yaml > other.json
          python3 - <<'PY'
          import json
          pod = json.load(open('spiffe.json'))
          volumes = {v['name']: v for v in pod['spec']['volumes']}
          assert volumes['seclume-spiffe']['csi']['driver'] == 'csi.spiffe.io', volumes
          env = {e['name']: e['value'] for e in pod['spec']['containers'][0]['env']}
          assert env['SPIFFE_ENDPOINT_SOCKET'] == 'unix:///spiffe-workload-api/spire-agent.sock'
          other = json.load(open('other.json'))
          assert 'seclume-spiffe' not in [v['name'] for v in other['spec'].get('volumes', [])]
          assert 'seclume.space/injected' not in other['metadata'].get('annotations', {})
          print('the socket where asked, nothing elsewhere')
          PY
      # Why, on the pull request: the webhook's and the pods' last words.
      - if: failure()
        run: |
          say() { echo "::error title=$1::$(printf '%s' "$2" | sed 's/%/%25/g' | tr '\n' ' ' | cut -c1-3000)"; }
          say webhook "$(kubectl logs -n seclume-system -l app.kubernetes.io/name=seclume-admission --tail=30 2>&1; kubectl logs -n seclume-system -l app=seclume-admission --tail=30 2>&1)"
          say pods "$(kubectl get pods -A -o wide 2>&1 | tail -20)"
          say events "$(kubectl get events -A --sort-by=.lastTimestamp 2>&1 | tail -20)"
          say oom "$(kubectl -n shop logs oom --all-containers --tail=20 2>&1)"
          say webhook-config "$(kubectl get mutatingwebhookconfiguration -o yaml 2>&1 | grep -v caBundle | tail -40)"
      - name: Remove the cluster
        if: always()
        run: kind delete cluster --name seclume || true
  # The Helm chart: linted and rendered in every TLS mode, then installed on
  # kind - first with the CA Helm makes, then switched to cert-manager - and
  # each time a pod in an opted-in namespace must come back mutated.
  admission-helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - name: Lint and render every TLS mode
        run: |
          set -euo pipefail
          chart=seclume-admission/helm/seclume-admission
          helm lint "$chart" --set image.repository=example/seclume-admission
          for mode in selfSigned certManager; do
            helm template t "$chart" --set image.repository=example/seclume-admission \
              --set tls.mode=$mode > /dev/null
          done
          helm template t "$chart" --set image.repository=example/seclume-admission \
            --set tls.mode=existingSecret --set tls.existingSecret=mine \
            --set tls.caBundle=Y2E= > /dev/null
          # What must not render: no image, an unknown mode.
          ! helm template t "$chart" > /dev/null 2>&1
          ! helm template t "$chart" --set image.repository=x --set tls.mode=none > /dev/null 2>&1
      - run: ./mvnw -B -pl seclume-admission,seclume-heapcheck -am package -DskipTests
      - name: Installed on kind with the chart's own CA
        run: |
          set -euo pipefail
          command -v kind >/dev/null || go install sigs.k8s.io/kind@v0.27.0
          export PATH="$PATH:$(go env GOPATH)/bin"
          kind create cluster --name seclume --wait 180s
          bash seclume-admission/deploy/build-image.sh seclume-admission:ci
          kind load docker-image seclume-admission:ci --name seclume
          helm install seclume seclume-admission/helm/seclume-admission \
            --namespace seclume-system --create-namespace \
            --set image.repository=seclume-admission --set image.tag=ci --wait --timeout 180s
          kubectl create namespace shop
          kubectl label namespace shop seclume.space/inject=enabled
          # The webhook may still be taking up a new certificate, and its
          # failurePolicy lets a pod through unchanged meanwhile: ask until it
          # answers, for a minute, then fail.
          check() {
            for _ in $(seq 1 30); do
              kubectl -n shop create --dry-run=server -o json \
                -f seclume-admission/ci/spiffe-pod.yaml > pod.json
              python3 -c "import json, sys; p = json.load(open('pod.json')); \
                sys.exit(0 if p['metadata'].get('annotations', {}).get('seclume.space/injected') == 'spiffe' else 1)" \
                && return 0
              sleep 2
            done
            echo "::error title=admission-helm::the webhook never mutated the pod"; return 1
          }
          check
          # An upgrade keeps the CA: the webhook still answers.
          helm upgrade seclume seclume-admission/helm/seclume-admission \
            --namespace seclume-system --reuse-values --wait --timeout 180s
          check
      - name: Switched to cert-manager
        run: |
          set -euo pipefail
          # The webhook may still be taking up a new certificate, and its
          # failurePolicy lets a pod through unchanged meanwhile: ask until it
          # answers, for a minute, then fail.
          check() {
            for _ in $(seq 1 30); do
              kubectl -n shop create --dry-run=server -o json \
                -f seclume-admission/ci/spiffe-pod.yaml > pod.json
              python3 -c "import json, sys; p = json.load(open('pod.json')); \
                sys.exit(0 if p['metadata'].get('annotations', {}).get('seclume.space/injected') == 'spiffe' else 1)" \
                && return 0
              sleep 2
            done
            echo "::error title=admission-helm::the webhook never mutated the pod"; return 1
          }
          kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.18.2/cert-manager.yaml
          kubectl -n cert-manager rollout status deploy/cert-manager-webhook --timeout=180s
          helm upgrade seclume seclume-admission/helm/seclume-admission \
            --namespace seclume-system --reuse-values --set tls.mode=certManager \
            --wait --timeout 180s
          kubectl -n seclume-system wait certificate/seclume-seclume-admission --for=condition=Ready \
            --timeout=120s
          kubectl -n seclume-system rollout restart deploy/seclume-seclume-admission
          kubectl -n seclume-system rollout status deploy/seclume-seclume-admission --timeout=180s
          for _ in $(seq 1 30); do
            bundle=$(kubectl get mutatingwebhookconfiguration seclume-seclume-admission \
              -o jsonpath='{.webhooks[0].clientConfig.caBundle}')
            test -n "$bundle" && break
            sleep 2
          done
          check
      # Why, on the pull request: the webhook's and the pods' last words.
      - if: failure()
        run: |
          say() { echo "::error title=$1::$(printf '%s' "$2" | sed 's/%/%25/g' | tr '\n' ' ' | cut -c1-3000)"; }
          say webhook "$(kubectl logs -n seclume-system -l app.kubernetes.io/name=seclume-admission --tail=30 2>&1; kubectl logs -n seclume-system -l app=seclume-admission --tail=30 2>&1)"
          say pods "$(kubectl get pods -A -o wide 2>&1 | tail -20)"
          say events "$(kubectl get events -A --sort-by=.lastTimestamp 2>&1 | tail -20)"
          say oom "$(kubectl -n shop logs oom --all-containers --tail=20 2>&1)"
          say webhook-config "$(kubectl get mutatingwebhookconfiguration -o yaml 2>&1 | grep -v caBundle | tail -40)"
      - name: Remove the cluster
        if: always()
        run: kind delete cluster --name seclume || true
  # Everything provable without a database: the cryptography against the
  # published vectors, the heap-dump proof with its negative control, the pool
  # mechanics, and the rule that no forbidden API call slips in.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test required database coverage gate
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: The Maven Central bundle stays under 1,000 files
        run: python3 .github/scripts/central_bundle.py
      - name: Test heapcheck report comparison
        run: python3 -m unittest discover -s seclume-heapcheck/ci -p 'test_*.py'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      # setup-java's cache holds ~/.m2/repository - the dependencies. The
      # wrapper's own copy of Maven lives elsewhere and was fetched afresh by
      # every job, which on 22.09.2026 got one of nine a 429 from the
      # distribution host and a red build with nothing wrong in it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}
      # Azure's storage emulator, for seclume-azure's end-to-end test.
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: .github/ci-tools
      - run: python3 ../scripts/npm_audit.py
        working-directory: .github/ci-tools
      # SoftHSM, for the client key in a PKCS#11 token (Pkcs11ClientIdentityTest):
      # a token directory of the job's own, named by SOFTHSM2_CONF.
      - name: SoftHSM token store
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq softhsm2 opensc >/dev/null
          mkdir -p "$RUNNER_TEMP/softhsm/tokens"
          printf 'directories.tokendir = %s\nobjectstore.backend = file\n' \
            "$RUNNER_TEMP/softhsm/tokens" > "$RUNNER_TEMP/softhsm/softhsm2.conf"
          echo "SOFTHSM2_CONF=$RUNNER_TEMP/softhsm/softhsm2.conf" >> "$GITHUB_ENV"
      # seclume-mail brings its own SMTP server (a JDK one, in a JVM of its
      # own for the heap proof), so it needs nothing started beside it.
      - run: ./mvnw -B -pl seclume-core,seclume-tck,seclume-pool,seclume-nats,seclume-opentelemetry,seclume-verify,seclume-heapdump,seclume-logging,seclume-jpa,seclume-heapcheck,seclume-admission,seclume-mail,seclume-jwt,seclume-http,seclume-rabbitmq,seclume-keys,seclume-ssh,seclume-aws,seclume-ldap,seclume-azure,seclume-gcp,seclume-kubernetes,seclume-jgit,seclume-grpc,seclume-crac -am test
        env:
          SECLUME_AZURITE: ${{ github.workspace }}/.github/ci-tools/node_modules/.bin/azurite
      # Every test that carries a security claim ran and passed - none
      # skipped, none missing (.github/security-gate.json).
      # The CBOMs the core tests wrote - one of every kind of asset, one from an
      # application that read a key over TLS - against CycloneDX's own schema.
      # The access log a test signed, checked by a second implementation
      # (hashlib and the openssl command line) - and two forgeries it refuses.
      - name: The access log, checked independently
        run: |
          set -euo pipefail
          cd seclume-core/target
          python3 ../../.github/scripts/verify_access_log.py access-log-sample.jsonl access-log-key.der
          for forged in changed rewritten; do
            if python3 ../../.github/scripts/verify_access_log.py "access-log-$forged.jsonl" access-log-key.der; then
              echo "::error title=access log::the $forged log passed the independent check"
              exit 1
            fi
          done
      - name: CBOMs are valid CycloneDX 1.6
        run: >-
          node .github/ci-tools/validate-cbom.mjs
          seclume-core/target/cbom-sample.json seclume-core/target/cbom-end-to-end.json
          seclume-verify/src/test/resources/cbom/release-1.json
          seclume-verify/src/test/resources/cbom/release-2.json
      - name: Security gate
        if: success() || failure()
        run: python3 .github/scripts/security_gate.py --group core --platform linux-x64
      # A red run names its failing tests as annotations, so that they can be
      # read on the pull request without opening the log.
      - if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          found = 0
          for path in glob.glob('**/target/surefire-reports/TEST-*.xml', recursive=True):
              for case in ET.parse(path).getroot().iter('testcase'):
                  for bad in case.findall('failure') + case.findall('error'):
                      text = (bad.get('type') or '') + ': ' + (bad.get('message') or '')
                      causes = [l.strip() for l in (bad.text or '').splitlines() if l.strip().startswith('Caused by:')]
                      if 'failure threshold' in text:
                          continue
                      if causes:
                          text = causes[-1] + ' | ' + text
                      text = text.replace('%', '%25').replace('\r', ' ').replace('\n', ' ')[:700]
                      print(f"::error title={case.get('classname')}.{case.get('name')}::{text}")
                      found += 1
          print('failing tests:', found)
          PY

  # The security gate's core group on the other platforms seclume supports:
  # Linux on ARM64, and Windows, where the keys live in CNG rather than
  # OpenSSL and dump exclusion is WerRegisterExcludedMemoryBlock rather than
  # MADV_DONTDUMP. A test that skips there is not a test that passed there.
  security-platforms:
    name: security-platforms (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04-arm, platform: linux-arm64}
          - {os: windows-latest, platform: windows-x64}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - name: The security tests
        run: |
          tests=$("$(command -v python3 || command -v python)" .github/scripts/security_gate.py --group core --tests)
          ./mvnw -B -pl seclume-core,seclume-tck,seclume-heapdump,seclume-heapcheck,seclume-jpa -am test \
            -Dtest="$tests" -Dsurefire.failIfNoSpecifiedTests=false
      - name: Security gate
        if: success() || failure()
        run: '"$(command -v python3 || command -v python)" .github/scripts/security_gate.py --group core --platform ${{ matrix.platform }}'
      - if: failure()
        run: |
          "$(command -v python3 || command -v python)" - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob('**/target/surefire-reports/TEST-*.xml', recursive=True):
              for case in ET.parse(path).getroot().iter('testcase'):
                  for bad in case.findall('failure') + case.findall('error'):
                      text = (bad.get('type') or '') + ': ' + (bad.get('message') or '')
                      text = text.replace('%', '%25').replace('\r', ' ').replace('\n', ' ')[:600]
                      print(f"::error title={case.get('classname')}.{case.get('name')}::{text}")
          PY

  # Short coverage-guided JSON searches on every PR; the nightly fuzz
  # workflow runs the same targets for fifteen minutes each.
  json-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        method: [arbitraryDocumentsStayWithinBounds, generatedValuesRoundTrip]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}
      - name: Search JSON reader inputs
        env:
          JAZZER_FUZZ: '1'
        run: >
          ./mvnw -B -pl seclume-core -am test
          -Dtest='JsonOffFuzzTest#${{ matrix.method }}'
          -Djazzer.max_duration=60s -Dsurefire.failIfNoSpecifiedTests=false
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: json-finding-${{ matrix.method }}
          path: seclume-core/**/crash-*

  # A minute of coverage-guided search per decoder of hostile input on every
  # pull request: the TLS handshake and records, SCRAM, secret managers' HTTP,
  # key files, the SPIFFE agent's answers and KMS answers. The nightly fuzz
  # workflow runs the corpora in full; a finding is uploaded as an artifact.
  parser-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target:
          - ServerHelloFuzzTest#aHostileServerHelloFailsWithAnIoException
          - TlsRecordFuzzTest#recordsAfterTheHandshake
          - ScramFuzzTest#anyServerMessageIsReadOrRefused
          - SecretFetchFuzzTest#anyAnswerIsParsedOrRefused
          - KeyFilesFuzzTest#anyKeyFileIsReadOrRefused
          - WorkloadApiAnswerFuzzTest#anX509SvidAnswerEndsInAnSvidOrAnIoException
          - WorkloadApiAnswerFuzzTest#aJwtSvidAnswerEndsInATokenOrAnIoException
          - KmsAnswerFuzzTest#aRawSignatureBecomesDerOrAnIoException
          - EncryptedValueFuzzTest#anyStoredValueDecryptsOnlyIfItWasWritten
          - EncryptedValueFuzzTest#aesGcmSivRoundTripsAndRefusesAnyChange
          - ShamirShareFuzzTest#anyShareIsReadOrRefused
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}
      - name: Search for inputs that break the decoder
        env:
          JAZZER_FUZZ: '1'
          TARGET: ${{ matrix.target }}
        run: >
          ./mvnw -B -pl seclume-core -am test -Dtest="$TARGET"
          -Djazzer.max_duration=60s -Dsurefire.failIfNoSpecifiedTests=false
      # The finding on the pull request itself: the failure and the input, as
      # Base64, so that it can be turned into a regression test without
      # downloading the artifact.
      - if: failure()
        run: |
          python3 - <<'PY'
          import base64, glob, xml.etree.ElementTree as ET
          for path in glob.glob('**/target/surefire-reports/TEST-*.xml', recursive=True):
              for case in ET.parse(path).getroot().iter('testcase'):
                  for bad in case.findall('failure') + case.findall('error'):
                      text = ((bad.get('type') or '') + ': ' + (bad.get('message') or '')
                              + ' ' + (bad.text or '')[:600])
                      text = text.replace('%', '%25').replace('\r', ' ').replace('\n', ' ')
                      print(f"::error title={case.get('classname')}.{case.get('name')}::{text[:900]}")
          for crash in glob.glob('**/crash-*', recursive=True)[:3]:
              data = open(crash, 'rb').read()[:3000]
              print(f"::error title=input {crash.split('/')[-1]}::{base64.b64encode(data).decode()}")
          PY
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parser-finding-${{ strategy.job-index }}
          path: seclume-core/**/crash-*

  # examples/getting-started as a reader would run it: PostgreSQL and Vault in
  # Docker, the Spring Boot application built against this commit, and the
  # comparison - the usual way must leak the password into the heap, seclume
  # must not. A getting-started that does not start is worse than none.
  getting-started:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - run: ./mvnw -B -pl seclume-spring-boot-starter,seclume-postgresql,seclume-heapcheck -am install -DskipTests
      - name: The example, five minutes' worth
        run: |
          set -euo pipefail
          version=$(sed -n 's:^  <version>\(.*\)</version>:\1:p' pom.xml | head -1)
          cd examples/getting-started
          ./setup.sh
          ../../mvnw -B -q -f pom.xml package -DskipTests -Dseclume.version="$version"
          ./compare.sh "../../seclume-heapcheck/target/seclume-heapcheck-$version.jar"
      # What the applications and the containers said, on the pull request.
      - if: failure()
        run: |
          cd examples/getting-started
          for f in target/compare/*.log; do
            [ -f "$f" ] || continue
            # The cause, not the stack: Spring's failure analysis and every "Caused by".
            text=$(grep -E "APPLICATION FAILED|Description:|Reason:|Action:|Caused by|Exception:|ERROR" "$f" \
              | grep -v "^\s*at " | head -25 | sed 's/%/%25/g' | tr '\n' ' ' | cut -c1-3500)
            echo "::error title=$(basename "$f")::$text"
          done
          text=$(docker compose logs --tail 15 2>&1 | sed 's/%/%25/g' | tr '\n' ' ' | cut -c1-3000)
          echo "::error title=containers::$text"
      - if: always()
        run: cd examples/getting-started && docker compose down -v || true

  # The post-quantum key exchange, end to end. The own TLS stack offers
  # X25519MLKEM768 wherever OpenSSL 3.5 is there - and ubuntu-latest has 3.0,
  # so every other job runs with the hybrid off and would not notice it
  # breaking. Here OpenSSL 3.5 is built (once, then cached; the tarball checked
  # against its published SHA-256) and the handshake is made against its
  # s_server with the hybrid as the only group. SECLUME_OPENSSL35 makes the
  # test mandatory: a libcrypto without ML-KEM fails it rather than skips it.
  post-quantum:
    runs-on: ubuntu-latest
    env:
      OPENSSL_VERSION: '3.5.4'
      OPENSSL_SHA256: '967311f84955316969bdb1d8d4b983718ef42338639c621ec4c34fddef355e99'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}
      - id: openssl-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/openssl35
          key: openssl-${{ env.OPENSSL_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Build OpenSSL ${{ env.OPENSSL_VERSION }}
        if: steps.openssl-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o openssl.tar.gz "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz"
          echo "${OPENSSL_SHA256}  openssl.tar.gz" | sha256sum -c -
          tar xzf openssl.tar.gz
          cd "openssl-${OPENSSL_VERSION}"
          ./Configure --prefix="$HOME/openssl35" --libdir=lib no-docs no-tests shared
          make -j"$(nproc)" >/dev/null
          make install_sw >/dev/null
      - name: Handshake with X25519MLKEM768
        run: |
          # Bootstrap the verified wrapper before selecting the test's OpenSSL libraries.
          ./mvnw -v
          export SECLUME_OPENSSL35="$HOME/openssl35/bin/openssl"
          export LD_LIBRARY_PATH="$HOME/openssl35/lib"
          "$SECLUME_OPENSSL35" version
          ./mvnw -B -pl seclume-core -am test -Dtest=HybridHandshakeTest -Dsurefire.failIfNoSpecifiedTests=false

  # RabbitMQ with a TLS 1.3 listener: the official client and Spring AMQP log in
  # through seclume, a dropped connection recovers, and the password is not on
  # the heap. The broker is Ubuntu's own package, configured here.
  rabbitmq:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}
      # The current release in a container: Ubuntu's package is two
      # majors behind (3.12, out of support), and what users run is 4.x.
      - name: RabbitMQ 4.4 with TLS 1.3
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rabbit"
          cd "$RUNNER_TEMP/rabbit"
          openssl req -x509 -newkey rsa:2048 -nodes -keyout key.pem -out cert.pem -days 2 \
            -subj /CN=localhost -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
          printf '%s\n' 'listeners.ssl.default = 5671' \
            'ssl_options.cacertfile = /tls/cert.pem' \
            'ssl_options.certfile = /tls/cert.pem' \
            'ssl_options.keyfile = /tls/key.pem' \
            'ssl_options.versions.1 = tlsv1.3' > 20-tls.conf
          chmod 644 key.pem cert.pem 20-tls.conf
          # A hostname of its own: the node is rabbit@rabbit, and Erlang's
          # distribution does not start on a name it cannot resolve.
          docker run -d --name rabbit --hostname rabbit -p 5671:5671 \
            -v "$PWD/cert.pem:/tls/cert.pem:ro" -v "$PWD/key.pem:/tls/key.pem:ro" \
            -v "$PWD/20-tls.conf:/etc/rabbitmq/conf.d/20-tls.conf:ro" \
            docker.io/library/rabbitmq:4.4
          # As the broker's own user: a CLI run as root writes the Erlang
          # cookie first, owned by root, and the broker then cannot read it.
          for i in $(seq 1 60); do
            docker exec -u rabbitmq rabbit rabbitmq-diagnostics -q check_port_connectivity >/dev/null 2>&1 && break
            sleep 2
          done
          head -c 18 /dev/urandom | base64 | tr -d '/+=' > "$RUNNER_TEMP/rabbit-password"
          docker exec -i -u rabbitmq rabbit sh -c 'rabbitmqctl add_user seclume "$(cat)"' \
            < "$RUNNER_TEMP/rabbit-password"
          docker exec -u rabbitmq rabbit rabbitmqctl set_permissions -p / seclume '.*' '.*' '.*'
          cp cert.pem "$RUNNER_TEMP/rabbit-cert.pem"
      - run: ./mvnw -B -pl seclume-rabbitmq -am test
        env:
          SECLUME_RABBITMQ_PORT: '5671'
          SECLUME_RABBITMQ_CERT: ${{ runner.temp }}/rabbit-cert.pem
          SECLUME_RABBITMQ_PASSWORD_FILE: ${{ runner.temp }}/rabbit-password
          SECLUME_RABBITMQCTL: docker exec -u rabbitmq rabbit rabbitmqctl close_all_connections recovery-test
      # Why, on the pull request: the broker's last words and the failed tests.
      - if: failure()
        run: |
          echo "::error title=rabbitmq start::$(docker logs rabbit 2>&1 | grep -iE "error|reason|failed|cannot|eaddr|nxdomain" | head -15 | sed 's/%/%25/g' | tr '\n' ' ' | cut -c1-3000)"
          echo "::error title=rabbitmq end::$(docker logs rabbit 2>&1 | tail -12 | sed 's/%/%25/g' | tr '\n' ' ' | cut -c1-2000)"
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob('**/target/surefire-reports/TEST-*.xml', recursive=True):
              for case in ET.parse(path).getroot().iter('testcase'):
                  for bad in case.findall('failure') + case.findall('error'):
                      text = (bad.get('type') or '') + ': ' + (bad.get('message') or '')
                      text = text.replace('%', '%25').replace('\r', ' ').replace('\n', ' ')[:800]
                      print(f"::error title={case.get('classname')}.{case.get('name')}::{text}")
          PY

  # seclume's own MongoDB driver, the pre-authenticated socket for the official
  # one, and Spring Data on the driver - against a standalone, a replica set
  # of three and two mongos behind a load balancer, all with TLS required.
  # Without this job every MongoDB test skips
  # itself, and a green build would say nothing about them.
  mongodb:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 8.0, which most installations run, and the current 9.0.
        version: ['8.0', '9.0']
    env:
      MONGO_IMAGE: docker.io/library/mongo:${{ matrix.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}
      - name: MongoDB standalone and replica set
        run: bash .github/scripts/mongo_fixtures.sh "$RUNNER_TEMP/mongo"
      - name: MongoDB behind a load balancer
        run: bash .github/scripts/mongo_lb_fixtures.sh "$RUNNER_TEMP/mongo-lb"
      - run: >-
          ./mvnw -B -pl seclume-mongodb,seclume-mongodb-driver,seclume-mongodb-reactive,seclume-mongodb-spring-test -am
          test -Dseclume.mongo.host=127.0.0.1
      # Skipped is not passed: a test that found no server proves nothing.
      - name: Require executed MongoDB tests
        if: always()
        run: python3 .github/scripts/require_mongo_tests.py
      - name: Control - the official driver's own login leaves the password on the heap
        run: >-
          ./mvnw -B -pl seclume-mongodb-driver -am test -Dseclume.mongo.host=127.0.0.1
          -Dseclume.mongo.control=true -Dtest='ApmAgentHeapDumpTest#control*'
          -Dsurefire.failIfNoSpecifiedTests=false
      - if: always()
        run: |
          rm -rf .local-mongo-password .local-certauth .local-mongo-lb-password
          docker rm -f mongo mongo-rs1 mongo-rs2 mongo-rs3 || true
          docker rm -f slm-haproxy slm-mongos1 slm-mongos2 slm-shard slm-cfg || true

  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}
      - name: Elasticsearch and OpenSearch with TLS
        run: bash .github/scripts/search_fixtures.sh "$RUNNER_TEMP/search"
      - run: >-
          ./mvnw -B -pl seclume-elasticsearch -am test -Dseclume.search.host=127.0.0.1
          -Dtest='space.seclume.elasticsearch.**' -Dsurefire.failIfNoSpecifiedTests=false
      # Skipped is not passed here either.
      - name: Require executed search tests
        if: always()
        run: python3 .github/scripts/require_mongo_tests.py 'seclume-elasticsearch' 'search'
      - if: always()
        run: |
          rm -f .local-es-apikey .local-os-password .local-es-ca.pem
          docker rm -f seclume-es seclume-os || true

  # Redis (Jedis and Lettuce) and Kafka (SCRAM, PLAIN, OAUTHBEARER) against
  # real servers with TLS 1.3 - the proof scripts the modules carry, here with
  # docker. Then the controls: the vendors' own clients given the secret, and
  # the same heap search finding it.
  brokers:
    runs-on: ubuntu-latest
    env:
      CONTAINER_ENGINE: docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}
      - name: Redis and Kafka with TLS 1.3
        run: |
          bash seclume-redis/proof/redis.sh up 127.0.0.1
          bash seclume-kafka/proof/broker.sh up 127.0.0.1
          cp /tmp/seclume-redis/password .local-redis-password
          cp /tmp/seclume-redis/ca.pem .local-redis-ca.pem
          cp /tmp/seclume-kafka/password .local-kafka-password
          cp /tmp/seclume-kafka/token .local-kafka-token
          cp /tmp/seclume-kafka/ca.pem .local-kafka-ca.pem
      - run: >-
          ./mvnw -B -pl seclume-redis,seclume-kafka -am test
          -Dseclume.redis.host=127.0.0.1 -Dseclume.kafka.host=127.0.0.1
          -Dtest='space.seclume.redis.**,space.seclume.kafka.**' -Dsurefire.failIfNoSpecifiedTests=false
      # Vault's database engine: the driver logs in as Vault's user, renews the
      # lease and revokes it - against a real Vault and PostgreSQL. The Vault
      # token from a file, and from an AppRole and a JWT login.
      - name: Vault with dynamic PostgreSQL credentials
        run: |
          bash .github/scripts/vault_fixtures.sh "$RUNNER_TEMP/vault"
          ./mvnw -B -pl seclume-postgresql -am test -Dseclume.vault.host=127.0.0.1 \
            -Dtest='LocalVaultDynamicCredentialsTest,LocalVaultLoginTest,LocalVaultPkiLoginTest,LocalVaultTransitLoginTest,LocalVaultTransitFieldKeyTest' \
            -Dsurefire.failIfNoSpecifiedTests=false
          python3 .github/scripts/require_mongo_tests.py 'seclume-postgresql' 'Vault'
          ./mvnw -B -pl seclume-keys -am test -Dseclume.vault.host=127.0.0.1 \
            -Dtest='LocalVaultPkiTest' -Dsurefire.failIfNoSpecifiedTests=false
          python3 .github/scripts/require_mongo_tests.py 'seclume-keys' 'Vault PKI'
      # The same against OpenBao, the open-source fork: the same API, so the
      # same fixture and the same tests. A fixed release, so that a run is
      # reproducible; Dependabot does not see an image named in a script, so
      # it is raised here by hand (tags: openbao scripts/release/container-tags.sh).
      - name: OpenBao with dynamic PostgreSQL credentials
        run: |
          rm -f .local-vault-*
          docker rm -f slm-vault slm-vault-pg || true
          VAULT_IMAGE=quay.io/openbao/openbao:2.7.2 VAULT_CLI=bao \
            bash .github/scripts/vault_fixtures.sh "$RUNNER_TEMP/openbao"
          ./mvnw -B -pl seclume-postgresql -am test -Dseclume.vault.host=127.0.0.1 \
            -Dtest='LocalVaultDynamicCredentialsTest,LocalVaultLoginTest,LocalVaultPkiLoginTest,LocalVaultTransitLoginTest,LocalVaultTransitFieldKeyTest' \
            -Dsurefire.failIfNoSpecifiedTests=false
          python3 .github/scripts/require_mongo_tests.py 'seclume-postgresql' 'OpenBao'
          ./mvnw -B -pl seclume-keys -am test -Dseclume.vault.host=127.0.0.1 \
            -Dtest='LocalVaultPkiTest' -Dsurefire.failIfNoSpecifiedTests=false
          python3 .github/scripts/require_mongo_tests.py 'seclume-keys' 'OpenBao PKI'
      # AWS KMS's API, emulated by moto behind its own throwaway certificate: a
      # data key Encrypt made under a real key ARN, opened by kms-decrypt with a
      # SigV4-signed Decrypt, and an altered ciphertext refused by the service.
      - name: AWS KMS emulator
        run: |
          # moto behind a one-day certificate of the job's own, which the fixture trusts.
          mkdir -p "$RUNNER_TEMP/moto"
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 1 \
            -subj /CN=127.0.0.1 -addext subjectAltName=IP:127.0.0.1 \
            -keyout "$RUNNER_TEMP/moto/key.pem" -out "$RUNNER_TEMP/moto/cert.pem" 2>/dev/null
          chmod 644 "$RUNNER_TEMP/moto/key.pem"
          docker run -d --name slm-moto -p 4443:4443 -v "$RUNNER_TEMP/moto:/certs:ro" \
            motoserver/moto:5.1.22 -p 4443 -c /certs/cert.pem -k /certs/key.pem
          python3 .github/scripts/kms_fixture.py https://127.0.0.1:4443 "$RUNNER_TEMP/moto/cert.pem"
          ./mvnw -B -pl seclume-core -am test -Dtest=LocalAwsKmsDecryptTest \
            -Dsurefire.failIfNoSpecifiedTests=false
          python3 .github/scripts/require_mongo_tests.py 'seclume-core' 'AWS KMS emulator'
      - name: Require executed Redis and Kafka tests
        if: always()
        run: python3 .github/scripts/require_mongo_tests.py 'seclume-redis,seclume-kafka' 'Redis and Kafka'
      - name: Controls - the vendors' clients leave the secret on the heap
        run: >-
          ./mvnw -B -pl seclume-redis,seclume-kafka -am test
          -Dseclume.redis.host=127.0.0.1 -Dseclume.kafka.host=127.0.0.1
          -Dseclume.redis.control=true -Dseclume.kafka.control=true
          -Dtest='LocalLettuceTest#control*,LocalKafkaSaslSslTest#control*'
          -Dsurefire.failIfNoSpecifiedTests=false
      - if: always()
        run: |
          rm -f .local-redis-* .local-kafka-* .local-vault-* .local-kms-*
          docker rm -f slm-vault slm-vault-pg slm-moto || true
          bash seclume-redis/proof/redis.sh down || true
          bash seclume-kafka/proof/broker.sh down || true

  postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Two releases, so that a protocol difference shows up here and not at
        # somebody's installation.
        image: postgres:${{ matrix.version }}
        env:
          POSTGRES_USER: seclume_test
          POSTGRES_PASSWORD: ${{ secrets.PG_TEST_PASSWORD || 'seclume-ci-password' }}
          POSTGRES_DB: seclume_test
          # scram-sha-256 is the path the driver has to manage.
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        # 15 and 18, and the release candidate of 19, so that a protocol
        # change shows up before the release reaches anyone.
        version: ['15', '18', '19rc1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      # setup-java's cache holds ~/.m2/repository - the dependencies. The
      # wrapper's own copy of Maven lives elsewhere and was fetched afresh by
      # every job, which on 22.09.2026 got one of nine a 429 from the
      # distribution host and a red build with nothing wrong in it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}
      - run: printf '%s' "${{ secrets.PG_TEST_PASSWORD || 'seclume-ci-password' }}" > .local-pg-password
      - run: ./mvnw -B -pl seclume-postgresql,seclume-pool,seclume-spring-boot-starter,seclume-jasperreports-proof -am test
      # The password is nowhere in the process after a TLS login - searched in
      # all of its memory, not only the heap (ProcessMemoryTest). It needs a
      # server with TLS, which the service above is not: a second one, here.
      - name: Security gate
        if: success() || failure()
        run: python3 .github/scripts/security_gate.py --group postgresql --platform linux-x64
      - name: No password anywhere in the process
        env:
          PG_PASSWORD: ${{ secrets.PG_TEST_PASSWORD || 'seclume-ci-password' }}
        run: |
          docker run -d --name pgtls -p 5433:5432 -e POSTGRES_USER=seclume_test \
            -e POSTGRES_PASSWORD="$PG_PASSWORD" -e POSTGRES_DB=seclume_test \
            -e POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256 \
            postgres:${{ matrix.version }} postgres -c ssl=on \
            -c ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem \
            -c ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
          # Over TCP: the server initdb runs first listens on the socket only,
          # so a check there says ready before the real one is up.
          for i in $(seq 1 60); do docker exec pgtls pg_isready -q -h 127.0.0.1 && break; sleep 1; done
          printf '%s' "$PG_PASSWORD" > .local-pgtls-password
          # Out of the environment before Maven: the probe would inherit it,
          # and a process's environment lies at the top of its stack.
          unset PG_PASSWORD
          ./mvnw -B -pl seclume-postgresql -am test -Dtest=ProcessMemoryTest \
            -Dsurefire.failIfNoSpecifiedTests=false -Dseclume.pgtls.host=127.0.0.1
          # Skipped is not passed: a missing server must not look like a proof.
          grep -q 'Tests run: 3, Failures: 0, Errors: 0, Skipped: 0' \
            seclume-postgresql/target/surefire-reports/*ProcessMemoryTest.txt
          # R2DBC's heap against the same server; the other three databases
          # are not in this job and skip. Case [1] is PostgreSQL, and it must
          # have run and passed - a self-closed testcase has no <skipped/>.
          ./mvnw -B -pl seclume-r2dbc -am test \
            -Dtest='LocalR2dbcFourDatabasesTest#thePasswordIsNotOnTheHeap,LocalEncryptedR2dbcTest' \
            -Dsurefire.failIfNoSpecifiedTests=false
          grep -qE 'name="thePasswordIsNotOnTheHeap\(Db\)\[1\]"[^>]*/>' \
            seclume-r2dbc/target/surefire-reports/TEST-*LocalR2dbcFourDatabasesTest.xml
          # Field encryption over R2DBC, against the same server: case [1] again.
          grep -qE 'name="valuesGoInEncryptedAndComeBackIntoNativeMemory\(Db\)\[1\]"[^>]*/>' \
            seclume-r2dbc/target/surefire-reports/TEST-*LocalEncryptedR2dbcTest.xml
      - if: always()
        run: |
          rm -f .local-pgtls-password
          docker rm -f pgtls || true
      - name: Verify framework edge cases
        run: ./mvnw -B -pl seclume-spring-test -am test -Dtest=JooqOnPostgresTest,MyBatisOnPostgresTest,LiquibaseOnPostgresTest,JpaFieldEncryptionOnPostgresTest,JakartaDataOnPostgresTest,SpringDataOnPostgresTest,EntityShapesOnPostgresTest,HibernateEdgesOnPostgresTest,SpringJdbcOnPostgresTest -Dsurefire.failIfNoSpecifiedTests=false
      - name: Require executed framework tests
        if: always()
        run: python3 .github/scripts/require_framework_tests.py Postgres
      - name: No test skipped for want of this job's server
        if: success() || failure()
        run: python3 .github/scripts/require_servers.py postgresql seclume-postgresql,seclume-spring-test
      - name: Verify pool isolation against PostgreSQL
        run: ./mvnw -B -pl seclume-pool -am test -Dtest=SessionResetTest,PoolHandOnSeamTest -Dsurefire.failIfNoSpecifiedTests=false
      - name: Require executed database regression tests
        if: always()
        run: python3 .github/scripts/require_pool_tests.py "PostgreSQL"
      - if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          found = 0
          for path in glob.glob('**/target/surefire-reports/TEST-*.xml', recursive=True):
              for case in ET.parse(path).getroot().iter('testcase'):
                  for bad in case.findall('failure') + case.findall('error'):
                      text = (bad.get('type') or '') + ': ' + (bad.get('message') or '')
                      causes = [l.strip() for l in (bad.text or '').splitlines() if l.strip().startswith('Caused by:')]
                      if 'failure threshold' in text:
                          continue
                      if causes:
                          text = causes[-1] + ' | ' + text
                      text = text.replace('%', '%25').replace('\r', ' ').replace('\n', ' ')[:700]
                      print(f"::error title={case.get('classname')}.{case.get('name')}::{text}")
                      found += 1
          print('failing tests:', found)
          PY
      # A skipped proof is green too; this says on the pull request whether
      # the JasperReports heap proof actually ran.
      - if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob('seclume-jasperreports-proof/target/surefire-reports/TEST-*.xml'):
              root = ET.parse(path).getroot()
              print(f"::notice title={root.get('name')}::tests={root.get('tests')} "
                    f"skipped={root.get('skipped')} failures={root.get('failures')} "
                    f"errors={root.get('errors')}")
          PY
      - if: always()
        run: rm -f .local-pg-password

  # PgBouncer in transaction mode with ONE server connection, so that every
  # client shares the same server session - what proxyMode=transaction is for,
  # and the leak it prevents shows up in PgBouncerTest's control.
  pgbouncer:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: seclume_test
          POSTGRES_PASSWORD: ${{ secrets.PG_TEST_PASSWORD || 'seclume-ci-password' }}
          POSTGRES_DB: seclume_test
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}
      - name: Start PgBouncer in transaction mode
        run: |
          mkdir bouncer
          pw="${{ secrets.PG_TEST_PASSWORD || 'seclume-ci-password' }}"
          printf '"seclume_test" "%s"\n' "$pw" > bouncer/userlist.txt
          cat > bouncer/pgbouncer.ini <<'EOF'
          [databases]
          seclume_test = host=127.0.0.1 port=5432 dbname=seclume_test
          [pgbouncer]
          listen_addr = 127.0.0.1
          listen_port = 6432
          auth_type = scram-sha-256
          auth_file = /etc/pgbouncer/userlist.txt
          pool_mode = transaction
          default_pool_size = 1
          max_prepared_statements = 200
          ignore_startup_parameters = extra_float_digits,options
          EOF
          chmod 777 bouncer && chmod 666 bouncer/*
          docker run -d --name bouncer --network host -v "$PWD/bouncer:/etc/pgbouncer" edoburu/pgbouncer@sha256:9c78945868a6a142c7fc40ccd843bbe5a606df163c7ffce4de70e0d628d696a2   # PgBouncer 1.26.0
          for i in $(seq 1 20); do (echo > /dev/tcp/127.0.0.1/6432) 2>/dev/null && break; sleep 1; done
      - run: printf '%s' "${{ secrets.PG_TEST_PASSWORD || 'seclume-ci-password' }}" > .local-pgtls-password
      - run: >-
          ./mvnw -B -pl seclume-diff -am test -Dtest=PgBouncerTest
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dseclume.pgbouncer.host=127.0.0.1 -Dseclume.pgbouncer.port=6432
      - if: always()
        run: |
          rm -f .local-pgtls-password bouncer/userlist.txt
          docker rm -f bouncer || true

  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MY_TEST_PASSWORD || 'seclume-ci-password' }}
          MYSQL_DATABASE: seclume_test
          MYSQL_USER: seclume_test
          MYSQL_PASSWORD: ${{ secrets.MY_TEST_PASSWORD || 'seclume-ci-password' }}
        ports: ['3306:3306']
        options: >-
          --health-cmd "${{ matrix.health }}"
          --health-interval 5s --health-timeout 5s --health-retries 20
    strategy:
      fail-fast: false
      matrix:
        # MySQL 8 uses caching_sha2_password, MariaDB mysql_native_password -
        # both paths have to work. They do not agree on what a health check is
        # called either: mysqladmin is gone from the MariaDB images.
        include:
          - image: 'mysql:8.4'
            health: 'mysqladmin ping -h 127.0.0.1'
          - image: 'mariadb:11.4'
            health: 'healthcheck.sh --connect --innodb_initialized'
          # The current lines: MySQL 9.7 LTS and the 26.x innovation release,
          # MariaDB 12.3 LTS and 13.0.
          - image: 'mysql:9.7'
            health: 'mysqladmin ping -h 127.0.0.1'
          - image: 'mysql:26.10'
            health: 'mysqladmin ping -h 127.0.0.1'
          - image: 'mariadb:12.3'
            health: 'healthcheck.sh --connect --innodb_initialized'
          - image: 'mariadb:13.0'
            health: 'healthcheck.sh --connect --innodb_initialized'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      # setup-java's cache holds ~/.m2/repository - the dependencies. The
      # wrapper's own copy of Maven lives elsewhere and was fetched afresh by
      # every job, which on 22.09.2026 got one of nine a 429 from the
      # distribution host and a red build with nothing wrong in it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}
      - run: printf '%s' "${{ secrets.MY_TEST_PASSWORD || 'seclume-ci-password' }}" > .local-mysql-password
      # What the driver's tests need of the server, set as a DBA would: functions
      # created with binary logging on (MySQL), and the right to list prepared XA
      # transactions (MySQL 8's XA_RECOVER_ADMIN). MariaDB needs neither.
      - name: Server settings for the function and XA tests
        env:
          MYSQL_PWD: ${{ secrets.MY_TEST_PASSWORD || 'seclume-ci-password' }}
        run: |
          if mysql -h 127.0.0.1 -P 3306 -u root -N -e 'select version()' | grep -qi mariadb; then
            echo "MariaDB: nothing to set"
          else
            mysql -h 127.0.0.1 -P 3306 -u root -e "SET PERSIST log_bin_trust_function_creators = 1; GRANT XA_RECOVER_ADMIN ON *.* TO 'seclume_test'@'%'"
          fi
          # The Spring application's Flyway wants an empty schema, not the one
          # the driver tests have filled.
          mysql -h 127.0.0.1 -P 3306 -u root -e "CREATE DATABASE IF NOT EXISTS seclume_spring; GRANT ALL ON seclume_spring.* TO 'seclume_test'@'%'"
      # The module's Local* tests default to port 3307, a developer's second
      # server; this job's is on 3306. Without saying so they skipped here -
      # eighteen of them - and require_servers.py now fails a job where that
      # happens again.
      - run: ./mvnw -B -pl seclume-mysql -am test -Dseclume.mysql.port=3306
      - name: Security gate
        if: success() || failure()
        run: python3 .github/scripts/security_gate.py --group mysql --platform linux-x64
      - name: Verify framework edge cases
        run: ./mvnw -B -pl seclume-spring-test -am test -Dtest=JooqOnMySqlTest,MyBatisOnMySqlTest,LiquibaseOnMySqlTest,JpaFieldEncryptionOnMySqlTest,JakartaDataOnMySqlTest,SpringDataOnMySqlTest,EntityShapesOnMySqlTest,HibernateEdgesOnMySqlTest,SpringJdbcOnMySqlTest -Dsurefire.failIfNoSpecifiedTests=false -Dseclume.mysql.port=3306 -Dseclume.spring.mysql.flavour=${{ startsWith(matrix.image, 'mariadb') && 'mariadb' || 'mysql' }}
      - name: Require executed framework tests
        if: always()
        run: python3 .github/scripts/require_framework_tests.py MySql
      - name: No test skipped for want of this job's server
        if: success() || failure()
        run: python3 .github/scripts/require_servers.py mysql seclume-mysql,seclume-spring-test
      - if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob('**/target/surefire-reports/TEST-*.xml', recursive=True):
              for case in ET.parse(path).getroot().iter('testcase'):
                  for bad in case.findall('failure') + case.findall('error'):
                      text = (bad.get('type') or '') + ': ' + (bad.get('message') or '')
                      causes = [l.strip() for l in (bad.text or '').splitlines() if l.strip().startswith('Caused by:')]
                      if 'failure threshold' in text:
                          continue
                      if causes:
                          text = causes[-1] + ' | ' + text
                      text = text.replace('%', '%25').replace('\r', ' ').replace('\n', ' ')[:700]
                      print(f"::error title={case.get('classname')}.{case.get('name')}::{text}")
          PY
      - name: Verify pool isolation against MySQL
        run: ./mvnw -B -pl seclume-pool -am test -Dtest=SessionResetTest -Dsurefire.failIfNoSpecifiedTests=false -Dseclume.mysql.port=3306
      - name: Require executed database regression tests
        if: always()
        run: python3 .github/scripts/require_pool_tests.py "MySQL"
      - if: always()
        run: rm -f .local-mysql-password

  sqlserver:
    # 2022 keeps the plain name, which branch protection requires.
    name: ${{ matrix.version == '2022' && 'sqlserver' || format('sqlserver ({0})', matrix.version) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['2022', '2025']
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:${{ matrix.version }}-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: ${{ secrets.MSSQL_TEST_PASSWORD || 'seclume-CI-password-1' }}
        ports: ['1433:1433']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      # setup-java's cache holds ~/.m2/repository - the dependencies. The
      # wrapper's own copy of Maven lives elsewhere and was fetched afresh by
      # every job, which on 22.09.2026 got one of nine a 429 from the
      # distribution host and a red build with nothing wrong in it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}
      # The image brings no health check, and an open port is not one: the
      # listener is up long before the engine takes a login. The readiness
      # check is therefore the first thing that has to work anyway - creating
      # the database. The XA tests need one of their own, because a
      # distributed transaction is enlisted per database and master will not
      # do.
      - name: Wait for SQL Server and create the test database
        run: |
          id=$(docker ps -q --filter "ancestor=mcr.microsoft.com/mssql/server:${{ matrix.version }}-latest" | head -1)
          if [ -z "$id" ]; then echo "::error title=sqlserver::no SQL Server ${{ matrix.version }} container found"; exit 1; fi
          # seclume_spring: the Spring application's, whose Flyway wants it empty.
          sql="if db_id('seclume_test') is null create database seclume_test; if db_id('seclume_spring') is null create database seclume_spring"
          pw="${{ secrets.MSSQL_TEST_PASSWORD || 'seclume-CI-password-1' }}"
          for i in $(seq 1 40); do
            if docker exec "$id" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -P "$pw" -Q "$sql"; then
              exit 0
            fi
            sleep 5
          done
          echo "::error title=sqlserver::SQL Server ${{ matrix.version }} never accepted a login: $(docker logs "$id" 2>&1 | tail -15 | tr '\n' ' ' | cut -c1-2500)"
          exit 1
      - run: printf '%s' "${{ secrets.MSSQL_TEST_PASSWORD || 'seclume-CI-password-1' }}" > .local-mssql-password
      - run: ./mvnw -B -pl seclume-sqlserver -am test
      - name: Security gate
        if: success() || failure()
        run: python3 .github/scripts/security_gate.py --group sqlserver --platform linux-x64
      - name: Verify framework edge cases
        run: ./mvnw -B -pl seclume-spring-test -am test -Dtest=JooqOnSqlServerTest,MyBatisOnSqlServerTest,LiquibaseOnSqlServerTest,JpaFieldEncryptionOnSqlServerTest,JakartaDataOnSqlServerTest,SpringDataOnSqlServerTest,EntityShapesOnSqlServerTest,HibernateEdgesOnSqlServerTest,SpringJdbcOnSqlServerTest -Dsurefire.failIfNoSpecifiedTests=false -Dseclume.frameworks.sqlserver.database=seclume_test
      - name: Require executed framework tests
        if: always()
        run: python3 .github/scripts/require_framework_tests.py SqlServer
      - name: No test skipped for want of this job's server
        if: success() || failure()
        run: python3 .github/scripts/require_servers.py sqlserver seclume-sqlserver,seclume-spring-test
      - if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob('**/target/surefire-reports/TEST-*.xml', recursive=True):
              for case in ET.parse(path).getroot().iter('testcase'):
                  for bad in case.findall('failure') + case.findall('error'):
                      text = (bad.get('type') or '') + ': ' + (bad.get('message') or '')
                      causes = [l.strip() for l in (bad.text or '').splitlines() if l.strip().startswith('Caused by:')]
                      if 'failure threshold' in text:
                          continue
                      if causes:
                          text = causes[-1] + ' | ' + text
                      text = text.replace('%', '%25').replace('\r', ' ').replace('\n', ' ')[:700]
                      print(f"::error title={case.get('classname')}.{case.get('name')}::{text}")
          PY
      - name: Verify pool isolation against SQL Server
        run: ./mvnw -B -pl seclume-pool -am test -Dtest=SessionResetTest -Dsurefire.failIfNoSpecifiedTests=false
      - name: Require executed database regression tests
        if: always()
        run: python3 .github/scripts/require_pool_tests.py "SQL Server"
      - if: always()
        run: rm -f .local-mssql-password

  # Oracle Free covers the 12c login path, which is the one newer instances
  # use. The image takes longer to come up than the others.
  #
  # Started by hand on the host's network rather than as a service with a
  # port mapping. A mapped port on 127.0.0.1 goes through docker-proxy, which
  # copies the stream and drops TCP urgent data - and an Oracle break is the
  # urgent byte that makes the server look up from a running statement. Behind
  # the proxy every cancellation and query timeout arrived only once the
  # statement had finished anyway (26.09.2026).
  oracle:
    runs-on: ubuntu-latest
    env:
      ORA_PASSWORD: ${{ secrets.ORA_TEST_PASSWORD || 'seclume-ci-password' }}
    steps:
      - name: Start Oracle Free on the host network
        run: |
          docker run -d --name oracle --network host \
            -e ORACLE_PASSWORD="$ORA_PASSWORD" -e APP_USER=seclume_test \
            -e APP_USER_PASSWORD="$ORA_PASSWORD" \
            --health-cmd healthcheck.sh --health-interval 10s \
            --health-timeout 10s --health-retries 60 \
            gvenzl/oracle-free:23-slim
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      # setup-java's cache holds ~/.m2/repository - the dependencies. The
      # wrapper's own copy of Maven lives elsewhere and was fetched afresh by
      # every job, which on 22.09.2026 got one of nine a 429 from the
      # distribution host and a red build with nothing wrong in it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}
      - name: Wait for Oracle
        run: |
          for i in $(seq 1 90); do
            s=$(docker inspect -f '{{.State.Health.Status}}' oracle)
            [ "$s" = healthy ] && exit 0
            sleep 10
          done
          docker logs oracle | tail -50
          exit 1
      # LocalLogInAgainTest proves the reset clears an application context;
      # creating one needs this privilege, which APP_USER does not get.
      - name: Grant create any context
        run: |
          echo 'alter session set container=FREEPDB1;
          grant create any context to seclume_test;
          exit' | docker exec -i oracle sqlplus -s / as sysdba
      # The Spring application's own schema: its Flyway wants an empty one,
      # not the one the driver tests have filled.
      - name: A schema for the Spring application
        run: |
          printf '%s\n' 'alter session set container=FREEPDB1;' \
            "create user seclume_spring identified by \"$ORA_PASSWORD\" quota unlimited on users;" \
            'grant create session, create table, create sequence, create view, create procedure, create trigger to seclume_spring;' \
            'exit' | docker exec -i oracle sqlplus -s / as sysdba
      - run: printf '%s' "$ORA_PASSWORD" > .local-oracle-password
      - run: ./mvnw -B -pl seclume-oracle -am test
      - name: Security gate
        if: success() || failure()
        run: python3 .github/scripts/security_gate.py --group oracle --platform linux-x64
      - name: Verify framework edge cases
        run: ./mvnw -B -pl seclume-spring-test -am test -Dtest=JooqOnOracleTest,MyBatisOnOracleTest,LiquibaseOnOracleTest,JpaFieldEncryptionOnOracleTest,JakartaDataOnOracleTest,SpringDataOnOracleTest,EntityShapesOnOracleTest,HibernateEdgesOnOracleTest,SpringJdbcOnOracleTest -Dsurefire.failIfNoSpecifiedTests=false -Dseclume.spring.oracle.user=seclume_spring
      - name: Require executed framework tests
        if: always()
        run: python3 .github/scripts/require_framework_tests.py Oracle
      - name: No test skipped for want of this job's server
        if: success() || failure()
        run: python3 .github/scripts/require_servers.py oracle seclume-oracle,seclume-spring-test
      - if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob('**/target/surefire-reports/TEST-*.xml', recursive=True):
              for case in ET.parse(path).getroot().iter('testcase'):
                  for bad in case.findall('failure') + case.findall('error'):
                      text = (bad.get('type') or '') + ': ' + (bad.get('message') or '')
                      causes = [l.strip() for l in (bad.text or '').splitlines() if l.strip().startswith('Caused by:')]
                      if 'failure threshold' in text:
                          continue
                      if causes:
                          text = causes[-1] + ' | ' + text
                      text = text.replace('%', '%25').replace('\r', ' ').replace('\n', ' ')[:700]
                      print(f"::error title={case.get('classname')}.{case.get('name')}::{text}")
          PY
      - name: Verify pool isolation against Oracle
        run: ./mvnw -B -pl seclume-pool -am test -Dtest=SessionResetTest -Dsurefire.failIfNoSpecifiedTests=false
      - name: Require executed database regression tests
        if: always()
        run: python3 .github/scripts/require_pool_tests.py "Oracle"
      - if: always()
        run: rm -f .local-oracle-password

  # The PostgreSQL family: CockroachDB and YugabyteDB speak the same wire
  # protocol. What is checked here is not a new driver but the claim that the
  # existing one serves them - a test run instead of a driver.
  #
  # Both now demand a password, which is what makes these jobs evidence rather
  # than decoration. They demand different ones: CockroachDB has no
  # unencrypted port at all and authenticates with SCRAM-SHA-256, YugabyteDB
  # with md5. The tests assert which, so a server that quietly stopped asking
  # would fail here instead of passing.
  cockroachdb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      # setup-java's cache holds ~/.m2/repository - the dependencies. The
      # wrapper's own copy of Maven lives elsewhere and was fetched afresh by
      # every job, which on 22.09.2026 got one of nine a 429 from the
      # distribution host and a red build with nothing wrong in it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}
      # A secure CockroachDB needs its certificates before it starts, so they
      # are made into a throwaway volume first. The image's entrypoint refuses
      # a listen address that is not loopback - a restriction of that wrapper
      # script and not of the server - so the binary is called directly.
      - name: Start CockroachDB with certificates and a password
        run: |
          set -e
          image=cockroachdb/cockroach:v26.2.10
          certs="--certs-dir=/certs --ca-key=/certs/ca.key"
          docker volume create crdb-certs
          docker run --rm -v crdb-certs:/certs "$image" cert create-ca $certs
          docker run --rm -v crdb-certs:/certs "$image" cert create-node localhost 127.0.0.1 0.0.0.0 $certs
          docker run --rm -v crdb-certs:/certs "$image" cert create-client root $certs
          docker run -d --name crdb -v crdb-certs:/certs -p 26257:26257 --entrypoint /cockroach/cockroach "$image" start-single-node --certs-dir=/certs --listen-addr=0.0.0.0:26257 --advertise-addr=127.0.0.1:26257 --store=/tmp/crdb
          pw="${{ secrets.CRDB_TEST_PASSWORD || 'seclume-CI-password-1' }}"
          for i in $(seq 1 30); do
            if docker exec crdb /cockroach/cockroach sql --certs-dir=/certs --host=localhost:26257 -e "select 1" >/dev/null 2>&1; then break; fi
            sleep 3
          done
          docker exec crdb /cockroach/cockroach sql --certs-dir=/certs --host=localhost:26257 -e "create user seclume_test with password '$pw'; create database seclume_test; grant all on database seclume_test to seclume_test;"
      - run: printf '%s' "${{ secrets.CRDB_TEST_PASSWORD || 'seclume-CI-password-1' }}" > .local-crdb-password
      - run: ./mvnw -B -pl seclume-postgresql -am test -Dtest='LocalPostgresFamilyTest$Cockroach' -Dsurefire.failIfNoSpecifiedTests=false -Dseclume.crdb.host=127.0.0.1
      - if: always()
        run: rm -f .local-crdb-password; docker rm -f crdb || true

  yugabytedb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      # setup-java's cache holds ~/.m2/repository - the dependencies. The
      # wrapper's own copy of Maven lives elsewhere and was fetched afresh by
      # every job, which on 22.09.2026 got one of nine a 429 from the
      # distribution host and a red build with nothing wrong in it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}
      # --ysql_enable_auth is what turns password authentication on. Without
      # it the server lets anyone in, and the job proves nothing. YSQL listens
      # on the container's own address rather than on loopback, which is why
      # the readiness check asks the container where it is.
      - name: Start YugabyteDB with authentication
        run: |
          set -e
          docker run -d --name yb -p 5433:5433 yugabytedb/yugabyte:2026.1.2.0-b137 bin/yugabyted start --daemon=false --ysql_enable_auth=true
          pw="${{ secrets.YB_TEST_PASSWORD || 'seclume-ci-password' }}"
          for i in $(seq 1 60); do
            ip=$(docker exec yb hostname -i | tr -d '\r' | awk '{print $1}')
            if [ -n "$ip" ] && docker exec -e PGPASSWORD=yugabyte yb bin/ysqlsh -h "$ip" -U yugabyte -d yugabyte -c "select 1" >/dev/null 2>&1; then
              docker exec -e PGPASSWORD=yugabyte yb bin/ysqlsh -h "$ip" -U yugabyte -d yugabyte -c "create user seclume_test with password '$pw'" -c "create database seclume_test owner seclume_test"
              exit 0
            fi
            sleep 6
          done
          echo "YugabyteDB never accepted a login" >&2
          exit 1
      - run: printf '%s' "${{ secrets.YB_TEST_PASSWORD || 'seclume-ci-password' }}" > .local-yb-password
      - run: ./mvnw -B -pl seclume-postgresql -am test -Dtest='LocalPostgresFamilyTest$Yugabyte' -Dsurefire.failIfNoSpecifiedTests=false -Dseclume.yb.host=127.0.0.1
      # Why, on the pull request: the server's last words and the failed tests.
      - if: failure()
        run: |
          text=$(docker logs yb 2>&1 | tail -30 | sed 's/%/%25/g' | tr '\n' ' ' | cut -c1-3000)
          echo "::error title=yugabyted::$text"
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob('**/target/surefire-reports/TEST-*.xml', recursive=True):
              for case in ET.parse(path).getroot().iter('testcase'):
                  for bad in case.findall('failure') + case.findall('error'):
                      text = (bad.get('type') or '') + ': ' + (bad.get('message') or '')
                      text = text.replace('%', '%25').replace('\r', ' ').replace('\n', ' ')[:600]
                      print(f"::error title={case.get('classname')}.{case.get('name')}::{text}")
          PY
      - if: always()
        run: rm -f .local-yb-password; docker rm -f yb || true
