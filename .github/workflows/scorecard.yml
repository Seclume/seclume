# OpenSSF Scorecard: how the repository itself is kept - branch protection,
# pinned actions, token permissions, signed releases. Weekly and on pushes to
# main; the results go to the Security tab and the public Scorecard API, which
# is what the badge in the README would read.
name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '50 4 * * 1'

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@62b2cac7ed8198b15735ed49ab1e5cf35480ba46 # v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: results.sarif
