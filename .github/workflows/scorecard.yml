# OpenSSF Scorecard: how the repository itself is kept - branch protection,
# pinned actions, token permissions, signed releases. Weekly and on pushes to
# main; the results go to the Security tab and the public Scorecard API, which
# is what the badge in the README would read.
name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '50 4 * * 1'

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-26.04
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.4.4 (image on ghcr.io; v2.4.0 pulled from gcr.io, which now refuses)
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: results.sarif
