# OpenSSF Scorecard: how the repository itself is kept - branch protection,
# pinned actions, token permissions, signed releases. Weekly and on pushes to
# main; the results go to the Security tab and the public Scorecard API, which
# is what the badge in the README would read.
name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '50 4 * * 1'

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-26.04
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.4.4 (image on ghcr.io; v2.4.0 pulled from gcr.io, which now refuses)
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
