# The whole fuzz corpus, nightly.
#
# The ordinary CI jobs run a fixed sample of each corpus - seconds, so that
# nobody learns to skip the suite. This runs all of it: tens of thousands of
# broken frames against four hand-written wire protocols, and the same again
# through real session objects over a scripted hostile transport.
#
# No database service anywhere in here, and that is the point of the design:
# the decoders are reached through resume(), which takes up a stream somebody
# else authenticated, so every byte comes from the script and nothing has to
# be running for it to mean something.
name: fuzz

on:
  schedule:
    # 02:40 UTC. Not on the hour: GitHub's scheduler is busiest then and a
    # nightly that starts late often does not start at all.
    - cron: '40 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    # Experiment branch only: where the constant-time t comes from, on several runners.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: The constant-time class, three times
        run: |
          for i in 1 2 3; do
            .github/scripts/mvnw-retry.sh -B -pl seclume-core -am test -Dtest=ConstantTimeLeakageTest \
              -Dseclume.constantTime=true -Dsurefire.failIfNoSpecifiedTests=false || echo "RUN $i FAILED"
          done
          grep -m1 "model name" /proc/cpuinfo
