# CodeQL: GitHub's static analysis for Java, on every push to main and weekly.
#
# Built with the project's own build (not autobuild) so the analysis sees the
# same modules, Java 25 and the same compiler flags.
# Tests are skipped: CodeQL needs the code compiled, not run.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 4 * * 1'

permissions:
  contents: read

# A dependency or plugin whose checksum does not match fails the build instead
# of a warning (Maven reads MAVEN_ARGS since 3.9).
env:
  # --strict-checksums checks a download against the repository's own checksum;
  # the trusted checksums check it against .mvn/checksums, recorded once - a
  # repository or cache that serves other bytes for a pinned version fails the
  # build. New artifacts are not refused yet (failIfMissing): record them with
  # .github/scripts/record-checksums.sh.
  MAVEN_ARGS: >-
    --strict-checksums
    -Daether.artifactResolver.postProcessor.trustedChecksums=true
    -Daether.artifactResolver.postProcessor.trustedChecksums.checksumAlgorithms=SHA-256
    -Daether.trustedChecksumsSource.summaryFile=true
    -Daether.trustedChecksumsSource.summaryFile.basedir=${{ github.workspace }}/.mvn/checksums

jobs:
  analyze:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-and-quality
      - run: .github/scripts/mvnw-retry.sh -B -DskipTests -Dmaven.javadoc.skip=true install
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:java
