# CodeQL: GitHub's static analysis for Java, on every push to main and weekly.
#
# Built with the project's own build (not autobuild) so the analysis sees the
# same modules, Java 25 and the same compiler flags.
# Tests are skipped: CodeQL needs the code compiled, not run.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-and-quality
      - run: ./mvnw -B -DskipTests -Dmaven.javadoc.skip=true install
      - uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          category: /language:java
