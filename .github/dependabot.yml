# Dependabot: known vulnerabilities and new versions.
#
# The drivers have no runtime dependency beyond the JDK, so what this watches
# is the rest: the Spring starter's Spring Boot, the CRaC API, the test and
# benchmark stack (JUnit, Jazzer, JMH, the vendor drivers compared against),
# the Maven plugins - and the GitHub Actions, pinned to commit SHAs, which
# Dependabot keeps current together with their version comments.
#
# Grouped so that a week's updates arrive as a few pull requests rather than
# one per artifact: every pull request runs the full database matrix, and the
# free plan runs 20 jobs at a time. Security updates are not grouped and not
# delayed - they still come on their own, at once.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      major:
        update-types: [major]
    ignore:
      # Spring Boot manages these for the starter and the Spring tests; a
      # version Boot does not know can break its auto-configuration. They
      # move when Spring Boot moves.
      - dependency-name: "org.flywaydb:*"
      - dependency-name: "io.micrometer:*"
      # ojdbc 23.26.3 fails the vendor side of ApiSurfaceTest on logoff with
      # ORA-01435 against Oracle Free 23; 23.6 passes (26.09.2026, two runs
      # each). Only the comparison uses it - seclume never loads ojdbc.
      - dependency-name: "com.oracle.database.jdbc:ojdbc*"
        versions: ["23.26.3.0.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
