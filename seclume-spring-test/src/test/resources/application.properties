# Common to all three databases. The URL, the user and where the secret comes
# from are per profile - and never the secret itself.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
# One migration per database - named per profile. Spring Boot's {vendor}
# placeholder cannot be used here: it derives the vendor from the URL prefix,
# and "jdbc:seclume:mysql:" is not a prefix it knows.

seclume.datasources.main.pool.maximum-pool-size=4
seclume.datasources.main.pool.leak-detection-threshold=30s
