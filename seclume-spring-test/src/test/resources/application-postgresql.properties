seclume.datasources.main.url=jdbc:seclume:postgresql://${seclume.pg.host}:${seclume.pg.port}/seclume_test
seclume.datasources.main.username=seclume_test
seclume.datasources.main.secret.provider=file
seclume.datasources.main.secret.path=${seclume.test.password.file}

# A schema of its own, so this test neither sees nor disturbs what the driver
# tests leave in "public" - and so Flyway starts on an empty one.
spring.flyway.schemas=seclume_spring
spring.flyway.create-schemas=true
spring.jpa.properties.hibernate.default_schema=seclume_spring

spring.flyway.locations=classpath:db/migration/postgresql
