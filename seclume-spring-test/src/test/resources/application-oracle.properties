seclume.datasources.main.url=jdbc:seclume:oracle://${seclume.test.host}:1521/FREEPDB1
# A schema of its own in CI (seclume_spring), so that Flyway starts on an empty one.
seclume.datasources.main.username=${seclume.spring.oracle.user:seclume_test}
seclume.datasources.main.secret.provider=file
seclume.datasources.main.secret.path=${seclume.test.password.file}

spring.flyway.locations=classpath:db/migration/oracle
