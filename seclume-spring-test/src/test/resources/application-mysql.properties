seclume.datasources.main.url=jdbc:seclume:mysql://${seclume.test.host}:${seclume.mysql.port:3307}/${seclume.spring.mysql.database:seclume_spring}?allowPublicKeyRetrieval=true
seclume.datasources.main.username=seclume_test
seclume.datasources.main.secret.provider=file
seclume.datasources.main.secret.path=${seclume.test.password.file}

# The shared migrations, and what MySQL and MariaDB spell differently (a sequence).
spring.flyway.locations=classpath:db/migration/mysql,classpath:db/migration/mysql-flavour/${seclume.spring.mysql.flavour:mysql}

# The same schema for MySQL and MariaDB: a UUID is binary(16) on both. Hibernate's
# MariaDB dialect would otherwise expect MariaDB's own uuid type (10.7 and later).
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=BINARY
