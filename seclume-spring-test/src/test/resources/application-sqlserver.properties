# trustServerCertificate: the container makes its own certificate and nobody
# signed it. Deliberate for a test fixture, and named as what it is.
seclume.datasources.main.url=jdbc:seclume:sqlserver://db.example.invalid:1433/seclume_spring?trustServerCertificate=true
seclume.datasources.main.username=sa
seclume.datasources.main.secret.provider=file
seclume.datasources.main.secret.path=${seclume.test.password.file}

spring.flyway.locations=classpath:db/migration/sqlserver
