# Three changesets: a table, two rows, and a column with an index - the last
# one rolled back and applied again by FrameworksTest.
databaseChangeLog:
  - changeSet:
      id: 1-customer
      author: seclume
      changes:
        - createTable:
            tableName: lb_customer
            columns:
              - column:
                  name: id
                  type: int
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: varchar(80)
                  constraints:
                    nullable: false
              - column:
                  name: joined
                  type: date
  - changeSet:
      id: 2-rows
      author: seclume
      changes:
        - insert:
            tableName: lb_customer
            columns:
              - column: {name: id, valueNumeric: 1}
              - column: {name: name, value: "Ada"}
              - column: {name: joined, valueDate: "2026-09-23"}
        - insert:
            tableName: lb_customer
            columns:
              - column: {name: id, valueNumeric: 2}
              - column: {name: name, value: "Grüße"}
              - column: {name: joined, valueDate: "2026-09-24"}
  - changeSet:
      id: 3-email
      author: seclume
      changes:
        - addColumn:
            tableName: lb_customer
            columns:
              - column:
                  name: email
                  type: varchar(120)
        - createIndex:
            tableName: lb_customer
            indexName: lb_customer_email
            columns:
              - column:
                  name: email
