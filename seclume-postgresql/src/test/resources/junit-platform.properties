# Test classes side by side, four at a time; the methods of one class one
# after the other. Every class works on tables of its own (named per class or
# at random), and a backend is only ever terminated by its own pid. Classes
# that touch something global - the SecretScope counters, JFR, the clock, a
# heap dump - carry @Isolated and run alone.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=concurrent
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=4
