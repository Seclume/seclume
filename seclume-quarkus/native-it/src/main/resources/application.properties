# The four seclume kinds; the URLs, and with them where each password comes
# from, are given at run time.
quarkus.devservices.enabled=false
quarkus.datasource."pg".db-kind=seclume-postgresql
quarkus.datasource."pg".jdbc.url=${SECLUME_PG_URL}
quarkus.datasource."mysql".db-kind=seclume-mysql
quarkus.datasource."mysql".jdbc.url=${SECLUME_MYSQL_URL}
quarkus.datasource."mssql".db-kind=seclume-sqlserver
quarkus.datasource."mssql".jdbc.url=${SECLUME_MSSQL_URL}
quarkus.datasource."oracle".db-kind=seclume-oracle
quarkus.datasource."oracle".jdbc.url=${SECLUME_ORACLE_URL}

quarkus.native.additional-build-args=--enable-monitoring=heapdump
quarkus.native.native-image-xmx=3g
